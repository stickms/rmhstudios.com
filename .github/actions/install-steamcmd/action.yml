# Installs SteamCMD into $HOME/steamcmd (32-bit libs + the Valve installer).
# Shared by tf2-assets-sync, csgo-assets-sync and tf2-effect-diagnostics.
name: install-steamcmd
description: Install SteamCMD to $HOME/steamcmd
runs:
  using: composite
  steps:
    - name: Install SteamCMD
      shell: bash
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update -qq
        sudo apt-get install -y -qq lib32gcc-s1 lib32stdc++6 curl
        mkdir -p "$HOME/steamcmd" && cd "$HOME/steamcmd"
        curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar xz
