version: 2
updates:
  # JS/TS dependencies (pnpm). Grouped so related bumps land in one PR and the
  # weekly cadence keeps noise down. Majors are separated so they can be reviewed
  # more carefully than routine patch/minor bumps.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 8
    labels: ["dependencies"]
    groups:
      # The SSR framework moves as ONE unit (redesign audit D7): Start, Router,
      # the router plugin/devtools and Nitro are released in lockstep and pinned
      # to exact versions in package.json (Nitro is still a 3.0 beta), so a bump
      # of one without the others is the failure mode. The integration suite in
      # web-ci (a real build + boot against Postgres) is the gate for this group.
      framework:
        patterns: ["@tanstack/*", "nitro"]
      minor-and-patch:
        update-types: ["minor", "patch"]
        exclude-patterns: ["@tanstack/*", "nitro"]
      types:
        patterns: ["@types/*"]
    # Deliberate holds. Each names what lifts it; remove the entry when it does.
    ignore:
      # 4.5+ grows zod past its dated cap in the entry closure
      # (scripts/check-entry-composition.ts). Lifts when zod leaves the shell.
      - dependency-name: "zod"
        versions: [">=4.5.0"]
      # `typescript` is 7 (the native compiler, no JS API). The ratchet tests and a few
      # scripts that walk ASTs import the 6.x JS API through the `typescript-js` alias;
      # it stays on 6 until they move to a parser that ships its own API.
      - dependency-name: "typescript-js"
        versions: [">=7.0.0"]
      # Prisma 8 replaces the client API, schema format and migrate commands
      # (794 importing files): it moves as its own project once 8.0 is stable,
      # not as a Dependabot bump. The three packages move together.
      - dependency-name: "prisma"
        versions: [">=8.0.0"]
      - dependency-name: "@prisma/client"
        versions: [">=8.0.0"]
      - dependency-name: "@prisma/adapter-pg"
        versions: [">=8.0.0"]
      # Types track the runtime: Node 26 (Dockerfile, .nvmrc, engines).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "ci"]

  # Go microservices.
  - package-ecosystem: gomod
    directory: "/go-services"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "go"]
