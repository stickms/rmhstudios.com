# ─────────────────────────────────────────────────────────────────────────────
# Epic (book/textbook) content-build suite.
#
# `pnpm test:epic` (vitest.epic.config.ts) covers scripts/epic/ — manuscript
# validation, ornament rendering, typesetting, and the paginator that measures
# real layout in a browser. It is separate from the main suite because those
# three pagination/build tests launch Chromium, and every test in the main suite
# is deliberately environment-agnostic.
#
# It ran in NO workflow until the 2026-08-08 testing audit, while docs/testing.md
# claimed an `epic-tests.yml` gated it. This is that file. Path-filtered, so a
# frontend PR does not pay for a browser download: the account-wide concurrent
# runner cap is a tracked concern (docs/ci-speed-audit-2026-07-17.md §3).
# ─────────────────────────────────────────────────────────────────────────────
name: epic-tests

on:
  pull_request:
    paths:
      - 'scripts/epic/**'
      - 'vitest.epic.config.ts'
      - '.github/workflows/epic-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/epic/**'
      - 'vitest.epic.config.ts'
  workflow_dispatch: {}

concurrency:
  group: epic-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      # Node 24.18.0 to match the production Dockerfile (as in web-ci.yml).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm

      # postinstall runs `prisma generate` (schema-only, no DB needed).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # paginate.ts measures leaf overflow by laying the page out in a real
      # browser; without this the three layout tests fail at chromium.launch().
      # `--with-deps` pulls the shared libraries the runner image lacks.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Epic suite
        run: pnpm test:epic
