# ─────────────────────────────────────────────────────────────────────────────
# Deploys the on-call watchdog Worker (deploy/oncall-watchdog/) to Cloudflare
# whenever it changes on main, after its tests pass. On PRs it only tests —
# web-ci's paths-ignore skips deploy/**, so without this a watchdog-only PR is
# never tested before merge.
#
# Safety:
#   - The deploy job runs only on push to main (or a manual run on main) and
#     never on pull_request, so PR code — including from forks — can't reach
#     the token. The `oncall-watchdog` environment can add a required reviewer.
#   - CLOUDFLARE_API_TOKEN should be the "Edit Cloudflare Workers" template,
#     scoped to this one account and the rmhstudios.com zone. It cannot touch
#     DNS records, R2 or anything else.
#   - `wrangler deploy` never sets or prints Worker secrets: DISCORD_BOT_TOKEN,
#     ONCALL_SIGNING_SECRET and ONCALL_WEBHOOK_URL stay as set by hand.
#   - wrangler is pinned to an exact version, and actions are pinned by SHA,
#     like every other workflow here.
# ─────────────────────────────────────────────────────────────────────────────
name: oncall-watchdog

on:
  pull_request:
    paths:
      - "deploy/oncall-watchdog/**"
      - ".github/workflows/oncall-watchdog.yml"
  push:
    branches: [main]
    paths:
      - "deploy/oncall-watchdog/**"
      - ".github/workflows/oncall-watchdog.yml"
  workflow_dispatch: {}

# Never two deploys at once; a newer push supersedes a queued one.
concurrency:
  group: oncall-watchdog-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.151.3

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm exec vitest run deploy/oncall-watchdog
      - name: Lint
        run: pnpm exec eslint deploy/oncall-watchdog
      - name: Bundle (dry run)
        working-directory: deploy/oncall-watchdog
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --dry-run --outdir "$RUNNER_TEMP/oncall-bundle"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: oncall-watchdog
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Deploy
        working-directory: deploy/oncall-watchdog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set on the oncall-watchdog environment"
            exit 1
          fi
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy
