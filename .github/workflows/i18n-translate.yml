# Translate only unfinished strings added/changed by merges to main. The pending
# PR branch also stores paid results so an unmerged PR never repeats API work.
name: i18n-translate

on:
  push:
    branches: [main]
    paths:
      - 'locales/en/**'

# Finish and persist paid work before starting the next merge's run.
concurrency:
  group: i18n-translate
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Queued runs use the latest main, including merges while waiting.
          ref: main
          fetch-depth: 0

      - name: Check for DeepSeek key
        id: guard
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "DEEPSEEK_API_KEY not set — skipping translation."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare merge baseline and reusable translations
        if: steps.guard.outputs.run == 'true'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          branch="i18n/auto-translate"
          base="$BEFORE_SHA"
          mkdir -p "$RUNNER_TEMP/i18n-base" "$RUNNER_TEMP/i18n-reuse/locales"
          # Distinguish an absent branch (exit 2) from a network/auth failure.
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            base=$(git merge-base HEAD "origin/$branch")
            git archive "origin/$branch" locales | tar -x -C "$RUNNER_TEMP/i18n-reuse"
          else
            status=$?
            [ "$status" -eq 2 ] || exit "$status"
          fi
          # A missing/invalid baseline fails before any model call. Never fall
          # back to translating the entire historical backlog.
          git merge-base --is-ancestor "$base" HEAD
          git archive "$base" locales | tar -x -C "$RUNNER_TEMP/i18n-base"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.guard.outputs.run == 'true'
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Translate unfinished merge strings and regenerate resources
        if: steps.guard.outputs.run == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          I18N_BASE_DIR: ${{ runner.temp }}/i18n-base/locales
          I18N_REUSE_DIR: ${{ runner.temp }}/i18n-reuse/locales
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/translate-locales.ts
          pnpm exec tsx scripts/gen-i18n-resources.ts

      - name: Save translations and update the shared PR
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="i18n/auto-translate"
          if ! git diff --quiet -- locales lib/i18n; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -B "$branch"
            git add locales lib/i18n
            git commit -m "chore(i18n): translate unfinished merge strings"
            git push --force-with-lease origin "$branch"
          else
            echo "No unfinished merge strings — nothing to translate."
            exit 0
          fi
          # Paid results are already durable even if GitHub refuses PR creation.
          # A later merge reuses this branch instead of paying for them again.
          pr=$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            cat > "$RUNNER_TEMP/i18n-pr-body.md" <<'EOF'
          Translates unfinished strings added or changed by merges to main and regenerates the locale resources. Completed translations are reused across runs while this PR awaits merging. Historical missing strings are left for an explicit local backfill.
          EOF
            gh pr create --base main --head "$branch" \
              --title "chore(i18n): translate unfinished merge strings" \
              --body-file "$RUNNER_TEMP/i18n-pr-body.md"
          fi
