# Machine-translate the site's string catalogs with DeepSeek.
#
# Run it by hand from the Actions tab. English lives on main (locales/en); every
# other locale lives on the `i18n/catalogs` branch, and this workflow commits
# its output there directly. There is no pull request: the branch holds data,
# not code, and scripts/i18n-pull.sh copies it into every build. With `deploy`
# on (the default), a run that changed something then redeploys main so the new
# strings ship. See docs/translations.md.
#
# A string is never paid for twice:
#   - only keys that are missing, or whose English changed, are sent
#     (locales/<lng>/.sources.<ns>.json records what each was translated from);
#   - translations left on older `i18n/*` branches by the previous pipeline are
#     reused before any model call (scripts/i18n-collect-reuse.ts);
#   - identical English is sent once per locale, and strings with no words are
#     copied.
name: i18n-translate

on:
  workflow_dispatch:
    inputs:
      locales:
        description: 'Comma-separated locales, e.g. "ja,fr" (empty = every shipped locale)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Report what would be sent and stop (no API calls, no commit)'
        required: false
        default: false
        type: boolean
      deploy:
        description: 'Redeploy main afterwards so the new translations ship'
        required: false
        default: true
        type: boolean

# One run at a time, and never cancel one: a cancelled run loses paid work.
concurrency:
  group: i18n-translate
  cancel-in-progress: false

permissions:
  contents: write # push to i18n/catalogs
  actions: write # dispatch deploy.yml

env:
  CATALOGS: i18n/catalogs

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Check for the DeepSeek key
        if: ${{ !inputs.dry_run }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::error::The DEEPSEEK_API_KEY repository secret is not set."
            exit 1
          fi

      - uses: ./.github/actions/setup-deps

      - name: Pull the catalogs
        id: pull
        run: |
          set -euo pipefail
          bash scripts/i18n-pull.sh
          echo "base=$(cat locales/.catalogs-commit)" >> "$GITHUB_OUTPUT"

      # Old per-run branches from the previous pipeline hold paid translations
      # that never merged. Harmless and quick once they are deleted.
      - name: Collect translations already paid for
        id: reuse
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin '+refs/heads/i18n/*:refs/remotes/origin/i18n/*'
          dir="$RUNNER_TEMP/i18n-reuse"
          pnpm exec tsx scripts/i18n-collect-reuse.ts "$dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Translate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          I18N_LOCALES: ${{ inputs.locales }}
          I18N_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          I18N_REUSE_DIR: ${{ steps.reuse.outputs.dir }}
        run: pnpm exec tsx scripts/translate-locales.ts

      # The catalog tests are the gate for this branch: pull requests no longer
      # touch the other locales, so this is where a bad catalog would be caught.
      - name: Check the catalogs
        id: check
        if: ${{ !cancelled() && !inputs.dry_run }}
        continue-on-error: true
        run: pnpm exec vitest run lib/__tests__/i18n-catalogs.test.ts lib/__tests__/i18n-code-splitting.test.ts

      # Runs even if translation failed part-way or the check failed: every
      # catalog already written is paid for, and dropping it means paying again.
      - name: Commit to ${{ env.CATALOGS }}
        id: commit
        if: ${{ !cancelled() && !inputs.dry_run }}
        env:
          BASE: ${{ steps.pull.outputs.base }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          wt="$RUNNER_TEMP/catalogs"
          git worktree add --detach "$wt" "$BASE"
          rsync -a --delete --exclude=/en/ --exclude=/.catalogs-commit locales/ "$wt/locales/"
          cd "$wt"
          git add -A locales
          if git diff --cached --quiet; then
            echo "Nothing new: the catalogs already had every translation." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Translate missing and changed strings" -m "Run: $RUN_URL" -m "English from main $(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)."
          # The lease is the commit this run started from: if someone committed
          # a fix meanwhile, the push is refused and nothing of theirs is lost.
          git push --force-with-lease="refs/heads/$CATALOGS:$BASE" origin "HEAD:refs/heads/$CATALOGS"
          echo "Committed $(git rev-parse --short HEAD) to \`$CATALOGS\`: $(git diff --stat HEAD~1 HEAD | tail -1)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Redeploy main
        if: ${{ !cancelled() && inputs.deploy && steps.commit.outputs.changed == 'true' && steps.check.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml --ref main
          echo "Started a deploy of main with the new catalogs." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail if the catalog check failed
        if: ${{ !cancelled() && steps.check.outcome == 'failure' }}
        run: |
          echo "::error::The catalog check failed. The translations are saved on $CATALOGS but were not deployed; see the 'Check the catalogs' step."
          exit 1
