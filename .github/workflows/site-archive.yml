# Record old versions of the site for /site-history and publish them to R2 (cdn.rmhstudios.com/site-archive/).
#
# Each version in components/site-history/archive-versions.json is an old commit: this checks it out, builds it, serves it
# against a seeded Postgres, browses it with Playwright and saves everything it fetched as a WARC
# (scripts/site-archive/). ReplayWeb.page plays the WARC back in the visitor's browser, so the old site and its
# games run again, on the CDN origin and never on the live one.
#
# Everything is uploaded once. A version is recorded and uploaded only while it is not in the bucket (each record
# job checks again before it builds, and the upload itself refuses an existing object, so an overlapping run
# cannot record or upload it twice); the player files only when their bytes changed. Re-recording a version is
# explicit: the `force` input.
#
# Runs when the archive scripts or the version list change on main, and by hand. Needs the same S3_* repository
# secrets as csgo-assets-sync.yml; without them it reports that and stops.
name: site-archive

on:
  push:
    branches: [main]
    paths:
      - scripts/site-archive/**
      - components/site-history/archive-versions.json
      - .github/workflows/site-archive.yml
  workflow_dispatch:
    inputs:
      force:
        description: Re-record these version ids (comma-separated), or "all"
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: site-archive
  cancel-in-progress: false

env:
  REPLAYWEBPAGE_VERSION: 2.5.4

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.cfg.outputs.ready }}
      ids: ${{ steps.missing.outputs.ids }}
    env:
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_FORCE_PATH_STYLE: 'false'
    steps:
      - name: Check configuration
        id: cfg
        run: |
          missing=""
          for v in S3_ENDPOINT S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY S3_BUCKET; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Site archive skipped::Missing repository secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cfg.outputs.ready == 'true'
      - uses: ./.github/actions/setup-deps
        if: steps.cfg.outputs.ready == 'true'
      - name: Check the bucket is reachable (reads only)
        if: steps.cfg.outputs.ready == 'true'
        run: pnpm exec tsx scripts/site-archive/publish.ts check
      - name: Publish the player (play.html + ReplayWeb.page ${{ env.REPLAYWEBPAGE_VERSION }})
        if: steps.cfg.outputs.ready == 'true'
        run: |
          dir="$RUNNER_TEMP/player"
          mkdir -p "$dir"
          (cd "$RUNNER_TEMP" && npm pack "replaywebpage@$REPLAYWEBPAGE_VERSION" --silent && tar xzf "replaywebpage-$REPLAYWEBPAGE_VERSION.tgz")
          cp "$RUNNER_TEMP/package/index.html" "$RUNNER_TEMP/package/ui.js" "$RUNNER_TEMP/package/sw.js" "$dir/"
          cp scripts/site-archive/player/play.html "$dir/"
          pnpm exec tsx scripts/site-archive/publish.ts player "$dir"
      - name: List the versions to record
        id: missing
        if: steps.cfg.outputs.ready == 'true'
        env:
          ARCHIVE_FORCE: ${{ inputs.force }}
        run: |
          ids=$(pnpm exec tsx scripts/site-archive/publish.ts missing)
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "To record: $ids"

  record:
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.ids != '[]' && needs.plan.outputs.ids != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    env:
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_FORCE_PATH_STYLE: 'false'
      PGURL: postgresql://postgres:postgres@localhost:5432
      ARCHIVE_FORCE: ${{ inputs.force }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-deps
      - name: Still to record?
        id: needed
        run: echo "needed=$(pnpm exec tsx scripts/site-archive/publish.ts needed "${{ matrix.id }}")" >> "$GITHUB_OUTPUT"
      - name: Install Playwright's Chromium
        if: steps.needed.outputs.needed == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Record ${{ matrix.id }}
        if: steps.needed.outputs.needed == 'true'
        run: bash scripts/site-archive/archive-version.sh "${{ matrix.id }}" "$RUNNER_TEMP/out" 7140
      - name: Publish ${{ matrix.id }}
        if: steps.needed.outputs.needed == 'true'
        run: pnpm exec tsx scripts/site-archive/publish.ts version "${{ matrix.id }}" "$RUNNER_TEMP/out/${{ matrix.id }}.warc.gz"
