# Builds and required checks overlap. Cache maintenance runs in build-cache.yml.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_WEB: ghcr.io/stickms/rmhstudios-app
  IMAGE_FULL: ghcr.io/stickms/rmhstudios-app-full

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-deps

      - name: Restore typecheck cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/tsc
          key: tsc-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ runner.os }}-
      - name: Restore lint cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/eslint
          key: eslint-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-

      - name: Typecheck
        run: |
          mkdir -p .cache/tsc
          pnpm run typecheck

      - name: Lint
        run: |
          mkdir -p .cache/eslint
          pnpm exec eslint --cache --cache-location .cache/eslint/eslintcache --cache-strategy content

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

  test:
    name: unit (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-deps
      - name: Test
        run: pnpm test --shard=${{ matrix.shard }}/2

  build:
    runs-on: ${{ vars.ARM64_BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      actions: read
    outputs:
      commit_short: ${{ steps.commit.outputs.short }}
      commit_msg: ${{ steps.commit.outputs.msg }}
      commit_author: ${{ steps.commit.outputs.author }}
      discord_msg_id: ${{ steps.discord_out.outputs.id }}
      web_digest: ${{ steps.images.outputs.web }}
      full_digest: ${{ steps.images.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Resolve commit info (for Discord pipeline embed)
        id: commit
        if: github.ref == 'refs/heads/main'
        run: |
          set -uo pipefail
          {
            echo "short=$(git rev-parse --short HEAD)"
            echo "msg=$(git log -1 --pretty=%s)"
            echo "author=$(git log -1 --pretty=%an)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "COMMIT_SHORT=$(git rev-parse --short HEAD)"
            echo "COMMIT_MSG=$(git log -1 --pretty=%s)"
            echo "COMMIT_AUTHOR=$(git log -1 --pretty=%an)"
          } >> "$GITHUB_ENV"

      - name: Verify required deploy variables + secrets
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          PROD_BETTER_AUTH_URL: ${{ vars.PROD_BETTER_AUTH_URL }}
          PROD_VITE_BETTER_AUTH_URL: ${{ vars.PROD_VITE_BETTER_AUTH_URL }}
          PROD_VITE_SOCKET_URL: ${{ vars.PROD_VITE_SOCKET_URL }}
          PROD_VITE_RMHBOX_SOCKET_URL: ${{ vars.PROD_VITE_RMHBOX_SOCKET_URL }}
          PROD_VITE_RMHTUBE_SOCKET_URL: ${{ vars.PROD_VITE_RMHTUBE_SOCKET_URL }}
          PROD_VITE_DISCORD_ACTIVITY_CLIENT_ID: ${{ vars.PROD_VITE_DISCORD_ACTIVITY_CLIENT_ID }}
          PROD_VITE_CDN_BASE_URL: ${{ vars.PROD_VITE_CDN_BASE_URL }}
        run: |
          set -uo pipefail
          missing=""
          for name in DEPLOY_WEBHOOK_URL WEBHOOK_SECRET \
                      PROD_BETTER_AUTH_URL PROD_VITE_BETTER_AUTH_URL \
                      PROD_VITE_SOCKET_URL PROD_VITE_RMHBOX_SOCKET_URL \
                      PROD_VITE_RMHTUBE_SOCKET_URL PROD_VITE_DISCORD_ACTIVITY_CLIENT_ID \
                      PROD_VITE_CDN_BASE_URL; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required deploy config:$missing — see deploy/README.md 'Automated deploys — CI build → GHCR'." >&2
            exit 1
          fi

      - name: Discord — build started
        if: github.ref == 'refs/heads/main'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          bash .github/scripts/discord-notify.sh post 16776960 \
            "🟡 [PRODUCTION] Commit ${COMMIT_SHORT:-} — build started" \
            "${COMMIT_MSG:-}" "${COMMIT_AUTHOR:-}"
          echo "BUILD_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Discord — start the CI checklist
        if: github.ref == 'refs/heads/main'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "${DISCORD_WEBHOOK_URL:-}" ] && [ -n "${DISCORD_MSG_ID:-}" ] || { echo "Discord off — no checklist."; exit 0; }
          nohup bash .github/scripts/ci-checklist.sh watch > "$RUNNER_TEMP/ci-checklist.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ci-checklist.pid"

      - name: Export Discord message id
        id: discord_out
        if: always()
        run: echo "id=${DISCORD_MSG_ID:-}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build + push both images (bake, single graph)
        id: images
        env:
          GIT_SHA: ${{ github.sha }}
          COMPOSE_PROJECT_NAME: rmhstudios-prod
          DATABASE_URL: postgresql://ci-build:ci-build@localhost:5432/ci-build
          BETTER_AUTH_SECRET: ci-build-not-a-runtime-secret-000000000000
          BETTER_AUTH_URL: ${{ vars.PROD_BETTER_AUTH_URL }}
          VITE_BETTER_AUTH_URL: ${{ vars.PROD_VITE_BETTER_AUTH_URL }}
          VITE_SOCKET_URL: ${{ vars.PROD_VITE_SOCKET_URL }}
          VITE_RMHBOX_SOCKET_URL: ${{ vars.PROD_VITE_RMHBOX_SOCKET_URL }}
          VITE_RMHTUBE_SOCKET_URL: ${{ vars.PROD_VITE_RMHTUBE_SOCKET_URL }}
          VITE_DISCORD_ACTIVITY_CLIENT_ID: ${{ vars.PROD_VITE_DISCORD_ACTIVITY_CLIENT_ID }}
          VITE_CDN_BASE_URL: ${{ vars.PROD_VITE_CDN_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EXPORT_CACHE: false
          IMAGE_COMPRESSION: ${{ vars.DEPLOY_IMAGE_COMPRESSION || 'gzip' }}
        run: |
          set -euo pipefail
          export STATIC_ASSET_VERSIONS=$(node scripts/static-asset-versions.mjs)
          docker buildx bake -f docker-bake.hcl --metadata-file "$RUNNER_TEMP/images.json" --push web full
          jq '{web: .web["containerimage.digest"], full: .full["containerimage.digest"]}' "$RUNNER_TEMP/images.json" > "$RUNNER_TEMP/release-images.json"
          jq -er '"web=" + .web, "full=" + .full' "$RUNNER_TEMP/release-images.json" >> "$GITHUB_OUTPUT"

      - name: Stop checklist observer (release gate renders the final state)
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ci-checklist.pid" ]; then kill "$(cat "$RUNNER_TEMP/ci-checklist.pid")" 2>/dev/null || true; fi

      - name: Smoke the published production images
        env:
          GIT_SHA: ${{ github.sha }}
          WEB_DIGEST: ${{ steps.images.outputs.web }}
          FULL_DIGEST: ${{ steps.images.outputs.full }}
        run: bash scripts/ci/candidate-smoke.sh

      - name: Retain candidate image digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-images
          path: ${{ runner.temp }}/release-images.json
          retention-days: 30

      - name: Discord — build superseded (cancelled)
        if: cancelled() && github.ref == 'refs/heads/main'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          bash .github/scripts/discord-notify.sh edit 9807270 \
            "⏹️ [PRODUCTION] Commit ${COMMIT_SHORT:-} — build superseded by a newer commit" \
            "${COMMIT_MSG:-}" "${COMMIT_AUTHOR:-}"

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rmh
      BETTER_AUTH_SECRET: ci-integration-not-a-real-secret-00000000000
      BETTER_AUTH_URL: http://localhost:7005
      PORT: '7005'
      INTEGRATION_BASE_URL: http://localhost:7005
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start Postgres (background)
        run: |
          nohup sh -c 'docker run -d --name pg -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=rmh \
            pgvector/pgvector:pg16' > "$RUNNER_TEMP/pg-start.log" 2>&1 &
      - uses: ./.github/actions/setup-deps
      - name: Restore image variants
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: public/images/_variants
          key: image-variants-${{ runner.os }}-${{ hashFiles('public/images/**', 'scripts/gen-image-variants.ts', 'pnpm-lock.yaml') }}
          restore-keys: |
            image-variants-${{ runner.os }}-
      - name: Build
        run: pnpm run build:frontend
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 60); do
            if docker exec pg pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1; then echo "postgres ready (${i}s into the wait)"; exit 0; fi
            sleep 1
          done
          echo "postgres never became ready"; cat "$RUNNER_TEMP/pg-start.log"; docker logs pg 2>&1 | tail -40 || true
          exit 1
      - name: Migrate database
        run: pnpm exec prisma migrate deploy
      - name: Start the built server
        run: |
          nohup node .output/server/index.mjs > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "$INTEGRATION_BASE_URL/api/ready"; then echo "server ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "server did not become ready"
          tail -80 "$RUNNER_TEMP/server.log"
          exit 1
      - name: Integration tests
        run: pnpm test:integration
      - name: Server log (on failure)
        if: failure()
        run: tail -200 "$RUNNER_TEMP/server.log" || true
      - name: Stop the server
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null || true

  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      BAZEL_REMOTE_CACHE: ${{ secrets.BAZEL_REMOTE_CACHE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Did this push touch Go?
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git fetch --quiet --depth=1 origin "$BEFORE"; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$BEFORE" HEAD -- go-services MODULE.bazel .bazelrc .bazelversion; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "No Go changes in this push — skipping the Bazel tests."
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.changed.outputs.go == 'true'
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ runner.os }}-${{ hashFiles('go-services/go.sum', 'MODULE.bazel') }}
          restore-keys: bazel-disk-${{ runner.os }}-
      - name: bootstrap toolchain
        if: steps.changed.outputs.go == 'true'
        run: ./scripts/preflight.sh --guard
      - name: configure remote cache (opt-in)
        if: steps.changed.outputs.go == 'true' && env.BAZEL_REMOTE_CACHE != ''
        run: echo "build --remote_cache=${BAZEL_REMOTE_CACHE}" >> .bazelrc
      - name: build + test (bazel)
        if: steps.changed.outputs.go == 'true'
        run: bazelisk test --build_tests_only //go-services/...

  deploy-gate:
    needs: [ci, test, integration, build, go-test]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read  # final render of the Discord CI checklist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Gate failed — CI/build or a stall blocked the deploy
        if: needs.ci.result != 'success' || needs.test.result != 'success' || needs.integration.result != 'success' || needs.build.result != 'success' || needs.go-test.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MSG_ID: ${{ needs.build.outputs.discord_msg_id }}
          COMMIT_SHORT: ${{ needs.build.outputs.commit_short }}
          COMMIT_MSG: ${{ needs.build.outputs.commit_msg }}
          COMMIT_AUTHOR: ${{ needs.build.outputs.commit_author }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            DISCORD_FIELDS=$(bash .github/scripts/ci-checklist.sh fields | jq -c '.fields' 2>/dev/null || echo '[]') \
            bash .github/scripts/discord-notify.sh edit-or-post 15158332 \
              "🔴 [PRODUCTION] Commit ${COMMIT_SHORT:-${GIT_SHA:0:7}} — deploy BLOCKED (CI=${{ needs.ci.result }}, integration=${{ needs.integration.result }}, go=${{ needs.go-test.result }}, build=${{ needs.build.result }}); nothing shipped" \
              "${COMMIT_MSG:-}" "${COMMIT_AUTHOR:-}" || true
          fi
          echo "::error::Deploy gate failed — CI=${{ needs.ci.result }}, integration=${{ needs.integration.result }}, go=${{ needs.go-test.result }}, build=${{ needs.build.result }}. Images (if any) are inert; nothing shipped."
          exit 1

      - name: Trigger VPS deploy (webhook listener)
        if: needs.ci.result == 'success' && needs.test.result == 'success' && needs.integration.result == 'success' && needs.build.result == 'success' && needs.go-test.result == 'success'
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          COMMIT_REF: ${{ github.ref }}
          COMMIT_SHA: ${{ github.sha }}
          WEB_DIGEST: ${{ needs.build.outputs.web_digest }}
          FULL_DIGEST: ${{ needs.build.outputs.full_digest }}
          DISCORD_MSG_ID: ${{ needs.build.outputs.discord_msg_id }}
        run: node .github/scripts/release-webhook.mjs trigger

      - name: Discord — trigger failed (post-build handoff)
        if: failure() && needs.ci.result == 'success' && needs.test.result == 'success' && needs.integration.result == 'success' && needs.build.result == 'success' && needs.go-test.result == 'success' && github.ref == 'refs/heads/main'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MSG_ID: ${{ needs.build.outputs.discord_msg_id }}
          COMMIT_SHORT: ${{ needs.build.outputs.commit_short }}
          COMMIT_MSG: ${{ needs.build.outputs.commit_msg }}
          COMMIT_AUTHOR: ${{ needs.build.outputs.commit_author }}
        run: |
          bash .github/scripts/discord-notify.sh edit 15158332 \
            "🔴 [PRODUCTION] Commit ${COMMIT_SHORT:-} — CI green + images pushed, but the VPS deploy trigger failed (see Actions logs)" \
            "${COMMIT_MSG:-}" "${COMMIT_AUTHOR:-}"

  cache-maintenance:
    needs: build
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-cache.yml
    permissions:
      contents: read
      packages: write

  release-completion:
    needs: deploy-gate
    if: vars.DEPLOY_WAIT_FOR_RELEASE == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: Wait for validated host release
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: node .github/scripts/release-webhook.mjs wait
