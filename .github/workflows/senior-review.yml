name: senior-review

# Runs an LLM "senior SWE" review on every pull request, whoever authored it,
# and posts it as a PR comment. ADVISORY ONLY (owner decision, 2026-11-09): the
# job always succeeds, so it can never block a merge and must not be added to
# the required checks. A model timeout, an API error or an unparseable verdict
# is a warning annotation, nothing more; a FAIL verdict is surfaced as a
# warning annotation and in the comment, not as a red check.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to the same PR cancels an in-flight review of the stale commit so
# the gate reflects the latest code and we don't waste model tokens.
concurrency:
  group: senior-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  senior-swe-review:
    runs-on: ubuntu-latest
    # A hung reviewer would otherwise sit on the required check for six hours.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      # claude-code-action fetches a GitHub OIDC token at startup; without this
      # the action fails with "Unable to get ACTIONS_ID_TOKEN_REQUEST_URL".
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Materialize the PR diff to a file the reviewer reads. base...HEAD gives
      # exactly what this PR adds on top of its merge base. If the base ref is
      # somehow unavailable we fall back to the PR's own commit range rather than
      # leaving the reviewer with an empty file it would review as "no changes".
      - name: compute diff
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --quiet origin "$BASE" || true
          git diff "origin/$BASE...HEAD" > pr.diff 2>/dev/null \
            || git diff "$BASE_SHA...HEAD" > pr.diff 2>/dev/null \
            || : > pr.diff
          if [ -s pr.diff ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Diff is $(wc -l < pr.diff) lines."
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No diff against the base ref; nothing to review."
          fi

      # Claude reviews pr.diff and writes two artifacts into the workspace:
      #   review.md   — the full human-readable review
      #   verdict.txt — a single token, exactly PASS or FAIL
      #
      # continue-on-error keeps an action-level failure (API outage, rate limit,
      # timeout) out of the job result; the advisory report step below only annotates.
      - name: senior SWE review
        id: review
        if: steps.diff.outputs.has_changes == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@71d3414a2ac47c29d9b7d0da6ca01963a9a6e5fc # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-opus-5-5 --allowedTools Read,Write,Glob,Grep,Bash"
          prompt: |
            You are a senior software engineer reviewing a pull request the way you
            would review a colleague's PR before merge. The diff is in the file
            `pr.diff` in the repository root. You may read any other repo files with
            Read/Glob/Grep to understand context and conventions.

            Review for: correctness bugs, unhandled edge cases, needless complexity,
            duplicated logic that should reuse existing code, unclear naming, dead
            code, missing or weak tests, and deviations from this repository's
            conventions. Be specific and cite `file:line`. Ignore pure style nits a
            formatter would catch.

            Then make a merge decision. This review is advisory and a human decides the
            merge, so reserve FAIL for things you would genuinely refuse to merge:
            - FAIL only if there is at least one BLOCKING issue: a correctness bug
              that will misbehave in production, a likely regression, a security
              hole, data loss, or a missing test for genuinely risky new logic.
            - PASS for everything else. A long list of findings is not itself a
              reason to fail — quantity is not severity. Nits, refactor ideas,
              naming preferences, "could be simpler", missing tests for low-risk
              code, and stylistic or subjective disagreements are all non-blocking:
              report them in the review and still PASS.
            - When you are unsure whether an issue is blocking, choose PASS. A human
              still reviews this PR; your job is to catch the serious problems, not
              to be the last word.

            Write two files in the repository root, overwriting any existing ones:
            1. `review.md` — your full review in Markdown, ending with a
               "## Verdict" section that states PASS or FAIL and a one-line reason.
            2. `verdict.txt` — its entire contents must be exactly `PASS` or `FAIL`
               (uppercase, no other text or whitespace).

            Writing `verdict.txt` is mandatory and is the single most important
            thing you do — a missing file is treated as PASS, so a real blocking
            issue would slip through. Write both files with the Write tool, then
            verify with Bash: `cat verdict.txt`. If it is missing or contains
            anything other than PASS or FAIL, fix it before you finish. If you run
            out of budget or cannot complete the review, still write your best
            verdict (`PASS` when in doubt) rather than leaving the file unwritten.

      # Post the review as a PR comment regardless of verdict so the author always
      # sees the feedback. Never let a comment-posting hiccup fail the job: the
      # review is also echoed into the run log as a backstop.
      - name: post review comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -s review.md ]; then
            echo "::warning::No review.md produced by the reviewer; nothing to post."
            exit 0
          fi

          echo "----- review.md -----"
          cat review.md
          echo "---------------------"

          # GitHub rejects comment bodies over 65536 characters.
          body=review.md
          if [ "$(wc -c < review.md)" -gt 60000 ]; then
            head -c 60000 review.md > review.trimmed.md
            printf '\n\n_Review truncated — see the workflow run log for the full text._\n' >> review.trimmed.md
            body=review.trimmed.md
          fi

          gh pr comment "$PR_NUMBER" --body-file "$body" \
            || echo "::warning::Could not post the review comment; the full review is in the run log above."

      # Advisory summary. Never fails the job: a FAIL verdict becomes a warning
      # annotation, anything unusable becomes a different warning, and the step
      # always exits 0.
      - name: report verdict (advisory)
        if: always()
        env:
          HAS_CHANGES: ${{ steps.diff.outputs.has_changes }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          if [ "$HAS_CHANGES" != "true" ]; then
            echo "PR has no diff against its base; nothing to review."
            exit 0
          fi

          # Tolerate the ways a model decorates a one-word answer: surrounding
          # whitespace, **bold**, `code`, headings, trailing punctuation, and
          # lowercase.
          normalize() {
            tr -d '[:space:]' | tr -d '*_`#:.,!-' | tr '[:lower:]' '[:upper:]'
          }

          # First PASS/FAIL word anywhere on stdin, for when the file is prose
          # rather than the single bare token we asked for.
          first_token() {
            grep -oiE '\b(PASS|FAIL)\b' | head -n 1 | tr '[:lower:]' '[:upper:]' || true
          }

          verdict=""

          if [ -s verdict.txt ]; then
            raw="$(normalize < verdict.txt)"
            echo "verdict.txt normalized to: '$raw'"
            case "$raw" in
              PASS|PASSED|PASSES) verdict="PASS" ;;
              FAIL|FAILED|FAILS) verdict="FAIL" ;;
              *)
                verdict="$(first_token < verdict.txt)"
                if [ -n "$verdict" ]; then
                  echo "Recovered verdict '$verdict' from the text of verdict.txt."
                else
                  echo "::warning::verdict.txt did not contain a recognizable verdict."
                fi
                ;;
            esac
          else
            echo "::warning::verdict.txt is missing or empty."
          fi

          # Fall back to the "## Verdict" section of the review itself.
          if [ -z "$verdict" ] && [ -s review.md ]; then
            verdict="$(sed -n '/^#\{1,6\}[[:space:]]*Verdict/,$p' review.md | first_token)"
            if [ -n "$verdict" ]; then
              echo "Recovered verdict '$verdict' from the Verdict section of review.md."
            fi
          fi

          case "$verdict" in
            FAIL)
              echo "::warning::Senior SWE review flagged blocking issues (advisory, not a gate) — see the review comment on the PR."
              ;;
            PASS)
              echo "Senior SWE review passed."
              ;;
            *)
              echo "::warning::No usable verdict produced (reviewer step outcome: ${REVIEW_OUTCOME:-skipped}). Advisory only; nothing blocked."
              ;;
          esac

          exit 0
