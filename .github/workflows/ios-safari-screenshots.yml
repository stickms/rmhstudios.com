# Screenshots of the site in iOS Safari, in an iOS simulator on a GitHub macOS runner.
#
# Why: Safari's status-bar and tab-bar strips are drawn by iOS from the page, so they cannot be seen from Linux
# (Chromium has no such bars). The CSS contract is pinned by lib/__tests__/ios-edge-contract.test.ts; this is how you
# LOOK at the result. How to run it and read it: docs/ios-safari-screenshots.md.
#
# Manual only: macOS minutes cost ten times Linux, and a full build runs here. Not a gate.
name: iOS Safari screenshots

on:
  workflow_dispatch:
    inputs:
      routes:
        description: Comma-separated paths to shoot
        default: /,/terms
      open_globe:
        description: Also tap the docked globe and shoot it open (best effort, installs idb)
        type: boolean
        default: true
      theme:
        description:
          Also shoot with this official bought theme applied (a gradient wash), e.g. paper, sundial, aurora. "none"
          skips.
        default: paper
      probes:
        description:
          Space-separated names from scripts/ios-sim/probes (html-red body-blue root-red-body-clear fixed-edge-gradient
          doc-edge-blocks) to shoot, to learn what colours Safari's strips. Empty skips.
        default: ''
      only_probes:
        description: Skip the standard and themed captures and run only the probes
        type: boolean
        default: false
      runner:
        description: macOS runner label (needs Xcode with an iOS simulator runtime)
        default: macos-latest
      device:
        description: Preferred simulator name
        default: iPhone 17 Pro

permissions:
  contents: read

jobs:
  shoot:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      DATABASE_URL: postgresql://postgres@localhost:5432/rmh
      # The runner has 3 cores shared by the server, Postgres and the simulator: keep the pool small.
      DATABASE_POOL_SIZE: '4'
      BETTER_AUTH_SECRET: ios-sim-not-a-real-secret-0000000000000000
      BETTER_AUTH_URL: http://localhost:7005
      PORT: '7005'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-deps

      # No service containers on macOS, so Postgres is installed. The migrations need vector (pgvector), pg_trgm and
      # unaccent (the last two ship with Postgres).
      - name: Postgres
        run: |
          brew install postgresql@17 pgvector
          echo "$(brew --prefix postgresql@17)/bin" >> "$GITHUB_PATH"
          export PATH="$(brew --prefix postgresql@17)/bin:$PATH"
          brew services start postgresql@17
          for i in $(seq 1 30); do pg_isready -q && break; sleep 1; done
          createuser -s postgres
          createdb rmh
      - name: Migrate
        run: pnpm exec prisma migrate deploy
      - name: Build
        run: pnpm run build:frontend

      - name: Start the server
        run: |
          nohup node .output/server/index.mjs > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://localhost:7005/; then echo "server up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "server did not come up"; tail -80 "$RUNNER_TEMP/server.log"; exit 1
      # `/` has answered with the error page before: say so here rather than discovering it in the screenshot.
      - name: Probe the routes
        run: |
          for p in $(echo "${{ inputs.routes }}" | tr ',' ' '); do
            code=$(curl -s -o "$RUNNER_TEMP/probe.html" -w '%{http_code}' "http://localhost:7005$p")
            echo "$p -> $code"
            grep -o 'Something went wrong' "$RUNNER_TEMP/probe.html" | head -1 || true
          done
          echo "--- server log so far ---"; tail -60 "$RUNNER_TEMP/server.log"

      - name: Install idb (to tap the globe)
        if: inputs.open_globe || inputs.probes != ''
        continue-on-error: true
        run: |
          brew tap facebook/fb
          # Homebrew refuses to load a formula from a tap it has not been told to trust.
          brew trust facebook/fb
          brew install idb-companion
          pip3 install --break-system-packages fb-idb
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Capture (the site's own Day and Night)
        if: ${{ !inputs.only_probes }}
        env:
          ROUTES: ${{ inputs.routes }}
          DEVICE: ${{ inputs.device }}
          OPEN_GLOBE: ${{ inputs.open_globe && '1' || '0' }}
        run: scripts/ios-sim/capture.sh http://localhost:7005 "$RUNNER_TEMP/shots"

      # A bought theme is stored in the page's localStorage; a simulator cannot set another origin's storage, so a small
      # proxy on 7006 puts it there before the pre-paint script runs.
      - name: Capture (with a bought theme)
        if: always() && !inputs.only_probes && inputs.theme != '' && inputs.theme != 'none'
        env:
          ROUTES: ${{ inputs.routes }}
          DEVICE: ${{ inputs.device }}
          OPEN_GLOBE: ${{ inputs.open_globe && '1' || '0' }}
          APPEARANCES: light
          NAME_PREFIX: theme-${{ inputs.theme }}-
        run: |
          pnpm exec tsx scripts/ios-sim/theme-json.ts "${{ inputs.theme }}" > "$RUNNER_TEMP/theme.json"
          nohup node scripts/ios-sim/theme-proxy.mjs 7005 7006 "$RUNNER_TEMP/theme.json" > "$RUNNER_TEMP/proxy.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/proxy.pid"
          sleep 2
          scripts/ios-sim/capture.sh http://localhost:7006 "$RUNNER_TEMP/shots"

      # What drives the colour of Safari's status-bar and tab-bar strips? Each probe injects a stylesheet that paints
      # something a loud colour; the strip shows which element Safari reads (docs/ios-safari-screenshots.md).
      - name: Probe the strips
        if: always() && inputs.probes != ''
        env:
          DEVICE: ${{ inputs.device }}
          APPEARANCES: light
          OPEN_GLOBE: '0'
          SCROLL_BOTTOM: '1'
          MID_SWIPES: '4'
        run: |
          port=7010
          for probe in ${{ inputs.probes }}; do
            EXTRA_CSS="scripts/ios-sim/probes/$probe.css" nohup node scripts/ios-sim/theme-proxy.mjs 7005 $port none > "$RUNNER_TEMP/probe-$probe.log" 2>&1 &
            pid=$!
            sleep 2
            ROUTES=/terms NAME_PREFIX="probe-$probe-" scripts/ios-sim/capture.sh http://localhost:$port "$RUNNER_TEMP/shots" || echo "probe $probe failed"
            kill $pid 2>/dev/null || true
            port=$((port + 1))
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-safari-screenshots
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: warn
      - name: Server log
        if: always()
        run: tail -100 "$RUNNER_TEMP/server.log" 2>/dev/null || true
      - name: Postgres log
        if: always()
        run: tail -60 "$(brew --prefix)/var/log/postgresql@17.log" 2>/dev/null || true
      - name: Stop the servers
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/server.pid" 2>/dev/null)" 2>/dev/null || true
          kill "$(cat "$RUNNER_TEMP/proxy.pid" 2>/dev/null)" 2>/dev/null || true
