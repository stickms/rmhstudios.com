# ─────────────────────────────────────────────────────────────────────────────
# Multiplayer Balatro (native P2P PvP on /balatro).
#
# `pnpm test:balatro` (vitest.balatro.config.ts) covers lib/balatro/mp, the
# shared P2P transport (lib/shared/p2p), the hub's Balatro directory
# (server/socket-server/balatro) and scripts/balatro, and runs the Lua L1
# specs under PUC Lua 5.1 through lib/balatro/mp/__tests__/lua-specs.test.ts.
# The Lua wrapper FAILS without lua5.1, so this job installs it.
# `pnpm test:tf2` runs too: the P2P primitives are shared with TF2 (PLAN §0.12).
# The mission-critical slices (hub auth walk, rate-limit coverage, saves) stay
# in web-ci.yml's main suite. Path-filtered so unrelated PRs don't pay for it.
# ─────────────────────────────────────────────────────────────────────────────
name: balatro-mp-tests

on:
  pull_request:
    paths:
      - 'lib/balatro/**'
      - 'scripts/balatro/**'
      - 'server/socket-server/handlers/balatro-*'
      - 'server/socket-server/balatro/**'
      - 'server/socket-server/p2p/**'
      - 'lib/shared/p2p/**'
      - 'data/balatro-mp/**'
      - 'vitest.balatro*'
      - '.github/workflows/balatro-mp-tests.yml'
  push:
    branches: [main]
    paths:
      - 'lib/balatro/**'
      - 'scripts/balatro/**'
      - 'server/socket-server/handlers/balatro-*'
      - 'server/socket-server/balatro/**'
      - 'server/socket-server/p2p/**'
      - 'lib/shared/p2p/**'
      - 'data/balatro-mp/**'
      - 'vitest.balatro*'
  workflow_dispatch: {}

concurrency:
  group: balatro-mp-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node 24.21.0 to match the production Dockerfile (as in web-ci.yml).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm

      # postinstall runs `prisma generate` (schema-only, no DB needed).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PUC Lua 5.1 — the same VM family as love.js — for the L1 specs.
      - name: Install lua5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 > /dev/null && lua5.1 -v

      - name: Generated Lua protocol is fresh
        run: pnpm balatro:gen-protocol --check

      - name: Balatro suite (TS + Lua L1)
        run: pnpm test:balatro

      # The shared P2P primitives moved out of TF2 (lib/shared/p2p); TF2 must stay green.
      - name: TF2 suite
        run: pnpm test:tf2

      # Pack freshness (WS2 adds `--check` to the builder). Until the flag
      # exists the step reports and passes, so wave-1 PRs are not blocked.
      - name: Game pack freshness
        run: |
          if grep -q -- "--check" scripts/balatro/build-game-pack.py; then
            pip install fonttools pyoxipng
            python3 -I scripts/balatro/build-game-pack.py --check
          else
            echo "build-game-pack.py has no --check yet (WS2); skipping."
          fi

      # Bundle budget (PLAN §6.4, WS14 adds the script).
      - name: Bundle budget
        if: hashFiles('scripts/balatro/bundle-budget.ts') != ''
        run: node_modules/.bin/tsx scripts/balatro/bundle-budget.ts

  # End-to-end (PLAN §6.3) — STUB. WS14 fills this job in: headless Chromium,
  # the engine-spec harness (`--project engine`, a hard gate for the L2 SP
  # invariance spec) and the match stack (throwaway Postgres + hub + vite dev).
  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Balatro e2e suite
        run: pnpm test:balatro:e2e
