# ─────────────────────────────────────────────────────────────────────────────
# Multiplayer Balatro (native P2P PvP on /balatro) — PLAN §6, docs/balatro-mp.md.
#
# Job `test` (no browser):
#   - the Lua L1 specs under PUC Lua 5.1 (`pnpm test:balatro:lua`; also inside
#     `pnpm test:balatro` through lib/balatro/mp/__tests__/lua-specs.test.ts, which
#     FAILS without lua5.1, so this job installs it);
#   - `pnpm test:balatro` (vitest.balatro.config.ts: lib/balatro/mp, the shared P2P
#     transport lib/shared/p2p, the hub's Balatro directory, scripts/balatro);
#   - `pnpm test:tf2` (the P2P primitives are shared with TF2, PLAN §0.12);
#   - generated-protocol and game-pack freshness, and the bundle/pack budget (§6.4).
# The mission-critical slices (hub auth walk, rate-limit coverage, saves) stay in
# web-ci.yml's main suite.
#
# The e2e suite (vitest.balatro-e2e.config.ts) runs as parallel jobs, each on its own
# runner, alongside `test` rather than after it (the wall clock is the slowest job, not
# the sum of all of them):
#   - e2e-engine: the harness project (unit tests of the e2e machinery, no browser), then
#     the engine project — Lua L2, every lib/balatro/lua/mp_test/specs/*_spec.lua inside
#     the real love.wasm in headless Chromium (SwiftShader) on a static harness page, no
#     DB or hub; one boot for all files plus a second boot without the MP pack
#     (single-player golden seeds). A hard gate. It stays ONE job on purpose: every spec
#     file must be green after the files before it in the same boot, and the golden seeds
#     are compared after every content spec mounted and unmounted its sessions.
#   - e2e-match (matrix): the match project — multi-browser matches and bot-peer lobbies —
#     split into shards (testing/balatro-e2e/shards.ts). Each shard has its own Postgres
#     service, socket hub and `vite dev` (VITE_BALATRO_MP_TEST=1), with accounts made
#     through the sign-up API. A harness unit test fails when a match file is in no shard
#     or when this matrix and the shard list differ, so no scenario can drop out of CI.
#     BALATRO_E2E_REQUIRE_MATCH=1 turns "no stack" into a failure instead of a skip.
#   - e2e: the aggregate — green only when e2e-engine and every e2e-match shard are. It
#     keeps the name of the old single job: require this one in branch protection.
# Speed: every engine page runs the autopilot's turbo (testing/balatro-e2e/lib/turbo.ts:
# 8 game updates per frame and a draw every 4th frame; a Lua `wait_frames` still gets full
# frames). Software WebGL spends almost all of a frame drawing and Balatro advances at most
# 0.1 s of game time per frame, so turbo fast-forwards the animations ~5x without touching
# game logic or RNG. Every scenario runs on every PR, the 12-ante soak (E2E-24) included.
# The nightly schedule (and a manual run with `long: true`) runs the same jobs with turbo
# off (real-speed frames, so the fast path is never the only one: the soak then takes its
# "30 minutes of play") plus every engine spec file alone in a fresh boot
# (BALATRO_E2E_ISOLATE=1).
# Path-filtered so unrelated PRs don't pay for it.
# ─────────────────────────────────────────────────────────────────────────────
name: balatro-mp-tests

on:
  pull_request:
    paths:
      - 'lib/balatro/**'
      - 'scripts/balatro/**'
      - 'server/socket-server/handlers/balatro-*'
      - 'server/socket-server/balatro/**'
      - 'server/socket-server/p2p/**'
      - 'lib/shared/p2p/**'
      - 'data/balatro-mp/**'
      - 'data/balatro-pack/**'
      - 'vitest.balatro*'
      - 'testing/balatro-e2e/**'
      - 'components/balatro/**'
      - '.github/workflows/balatro-mp-tests.yml'
  push:
    branches: [main]
    paths:
      - 'lib/balatro/**'
      - 'scripts/balatro/**'
      - 'server/socket-server/handlers/balatro-*'
      - 'server/socket-server/balatro/**'
      - 'server/socket-server/p2p/**'
      - 'lib/shared/p2p/**'
      - 'data/balatro-mp/**'
      - 'data/balatro-pack/**'
      - 'vitest.balatro*'
      - 'testing/balatro-e2e/**'
      - 'components/balatro/**'
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      long:
        description: 'Real-speed frames (turbo off) and every engine spec alone in a fresh boot'
        type: boolean
        default: false

concurrency:
  group: balatro-mp-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm + Node 24.21.0 + node_modules (cached by lockfile + schema), as web-ci.yml.
      - uses: ./.github/actions/setup-deps

      # PUC Lua 5.1 — the same VM family as love.js — for the L1 specs.
      - name: Install lua5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 > /dev/null && lua5.1 -v

      - name: Lua L1 specs
        run: pnpm test:balatro:lua

      - name: Generated Lua protocol is fresh
        run: pnpm balatro:gen-protocol --check

      # scripts/balatro/__tests__/pack.test.ts and the pack builder need fontTools
      # (it fails with an install hint rather than skipping). The builder runs as
      # `python3 -I`, which ignores the user site that a non-root `pip install`
      # writes to, so install into the interpreter's own site-packages.
      - name: Install pack-builder Python deps
        run: sudo python3 -m pip install --quiet --break-system-packages fonttools pyoxipng && python3 -I -c 'import fontTools, oxipng'

      - name: Balatro suite (TS + Lua L1)
        run: pnpm test:balatro

      # The shared P2P primitives moved out of TF2 (lib/shared/p2p); TF2 must stay green.
      - name: TF2 suite
        run: pnpm test:tf2

      - name: Game pack freshness
        run: python3 -I scripts/balatro/build-game-pack.py --check

      # PLAN §6.4: SP route delta, MP chunks (socket.io-client is site-shared: see the
      # script's SOCKET_IO_INPUT note), test surface absent, pack sizes.
      - name: Bundle and pack budget
        run: node_modules/.bin/tsx scripts/balatro/bundle-budget.ts

  # Lua L2 in the real engine: the harness project, then the engine project (one job, see
  # the header).
  e2e-engine:
    # Paused on pull requests until a real run of this sharded layout confirms
    # its timing (owner's call); it runs on main, nightly and on demand.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.long == true) && 150 || 30 }}
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      LONG: ${{ github.event_name == 'schedule' || inputs.long == true }}
      # Empty = the default turbo (testing/balatro-e2e/lib/turbo.ts); the long run: off.
      BALATRO_E2E_TURBO: ${{ (github.event_name == 'schedule' || inputs.long == true) && 'off' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-deps

      # The headless shell is all the suite launches (chromium.launch, headless). The
      # download is cached by the lockfile (it pins Playwright); --with-deps still installs
      # the shared libraries the runner image lacks.
      - name: Restore Playwright's Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: E2E machinery (harness project)
        run: pnpm test:balatro:e2e --project harness

      - name: In-engine specs (engine project)
        env:
          BALATRO_E2E_ISOLATE: ${{ env.LONG == 'true' && '1' || '' }}
        run: pnpm test:balatro:e2e --project engine

  # Multi-browser matches, one shard per runner. The list below must equal the keys of
  # MATCH_SHARDS in testing/balatro-e2e/shards.ts (testing/balatro-e2e/lib/shards.unit.test.ts).
  e2e-match:
    # Paused on pull requests until a real run of this sharded layout confirms
    # its timing (owner's call); it runs on main, nightly and on demand.
    if: github.event_name != 'pull_request'
    name: e2e-match (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.long == true) && 120 || 30 }}
    strategy:
      # Every shard reports, so one red run shows every broken scenario.
      fail-fast: false
      matrix:
        shard: [nemesis-soak, nemesis-resilience, formats-spectate, migration, practice-queue]
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rmh
      BETTER_AUTH_SECRET: ci-balatro-e2e-not-a-real-secret-000000000
      BALATRO_E2E_LOG_DIR: ${{ github.workspace }}/balatro-e2e-logs
      BALATRO_E2E_REQUIRE_MATCH: '1'
      BALATRO_E2E_TURBO: ${{ (github.event_name == 'schedule' || inputs.long == true) && 'off' || '' }}
      # E2E-24, the 12-ante soak, on every run: ~2 minutes with turbo, ~30 at real speed (nightly).
      BALATRO_E2E_SOAK: '1'
    # Postgres as a service container (as web-ci.yml's eversion job): pgvector image, so the
    # embeddings migration applies as in production.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rmh
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-deps

      - name: Restore Playwright's Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      # Vite's dependency pre-bundle for `vite dev`: restored, the first /balatro page load
      # skips the optimizer run. Vite checks its own lockfile/config hash and re-optimizes
      # when it differs, so a partial key match is safe.
      - name: Restore the Vite dep pre-bundle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules/.vite/deps
          key: vite-deps-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}
          restore-keys: |
            vite-deps-v1-${{ runner.os }}-

      - name: Migrate database
        run: pnpm exec prisma migrate deploy

      - name: Matches (${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          files=$(node_modules/.bin/tsx testing/balatro-e2e/shards.ts "$SHARD")
          echo "shard $SHARD: $files"
          # shellcheck disable=SC2086 # one argument per file
          pnpm test:balatro:e2e --project match $files

      - name: Stack logs (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: balatro-e2e-logs-${{ matrix.shard }}
          path: balatro-e2e-logs
          if-no-files-found: ignore

  # The aggregate e2e result, under the old single job's name: it fails when e2e-engine or
  # any e2e-match shard failed, was cancelled or was skipped.
  e2e:
    needs: [e2e-engine, e2e-match]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every e2e job passed
        env:
          ENGINE: ${{ needs.e2e-engine.result }}
          MATCH: ${{ needs.e2e-match.result }}
        run: |
          echo "e2e-engine: $ENGINE; e2e-match (every shard): $MATCH"
          if [ "$ENGINE" != success ] || [ "$MATCH" != success ]; then
            echo "::error::Balatro e2e failed (engine: $ENGINE, match: $MATCH)"
            exit 1
          fi
