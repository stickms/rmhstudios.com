# ─────────────────────────────────────────────────────────────────────────────
# Multiplayer Balatro (native P2P PvP on /balatro).
#
# `pnpm test:balatro` (vitest.balatro.config.ts) covers lib/balatro/mp, the
# shared P2P transport (lib/shared/p2p), the hub's Balatro directory
# (server/socket-server/balatro) and scripts/balatro, and runs the Lua L1
# specs under PUC Lua 5.1 through lib/balatro/mp/__tests__/lua-specs.test.ts.
# The Lua wrapper FAILS without lua5.1, so this job installs it.
# `pnpm test:tf2` runs too: the P2P primitives are shared with TF2 (PLAN §0.12).
# The mission-critical slices (hub auth walk, rate-limit coverage, saves) stay
# in web-ci.yml's main suite. Path-filtered so unrelated PRs don't pay for it.
# ─────────────────────────────────────────────────────────────────────────────
name: balatro-mp-tests

on:
  pull_request:
    paths:
      - 'lib/balatro/**'
      - 'scripts/balatro/**'
      - 'server/socket-server/handlers/balatro-*'
      - 'server/socket-server/balatro/**'
      - 'server/socket-server/p2p/**'
      - 'lib/shared/p2p/**'
      - 'data/balatro-mp/**'
      - 'vitest.balatro*'
      - 'testing/balatro-e2e/**'
      - 'components/balatro/**'
      - '.github/workflows/balatro-mp-tests.yml'
  push:
    branches: [main]
    paths:
      - 'lib/balatro/**'
      - 'scripts/balatro/**'
      - 'server/socket-server/handlers/balatro-*'
      - 'server/socket-server/balatro/**'
      - 'server/socket-server/p2p/**'
      - 'lib/shared/p2p/**'
      - 'data/balatro-mp/**'
      - 'vitest.balatro*'
      - 'testing/balatro-e2e/**'
      - 'components/balatro/**'
  workflow_dispatch: {}

concurrency:
  group: balatro-mp-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node 24.21.0 to match the production Dockerfile (as in web-ci.yml).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm

      # postinstall runs `prisma generate` (schema-only, no DB needed).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PUC Lua 5.1 — the same VM family as love.js — for the L1 specs.
      - name: Install lua5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 > /dev/null && lua5.1 -v

      - name: Generated Lua protocol is fresh
        run: pnpm balatro:gen-protocol --check

      # scripts/balatro/__tests__/pack.test.ts and the pack builder need fontTools
      # (it fails with an install hint rather than skipping).
      - name: Install pack-builder Python deps
        run: pip install fonttools pyoxipng

      - name: Balatro suite (TS + Lua L1)
        run: pnpm test:balatro

      # The shared P2P primitives moved out of TF2 (lib/shared/p2p); TF2 must stay green.
      - name: TF2 suite
        run: pnpm test:tf2

      # Pack freshness (WS2 adds `--check` to the builder). Until the flag
      # exists the step reports and passes, so wave-1 PRs are not blocked.
      - name: Game pack freshness
        run: |
          if grep -q -- "--check" scripts/balatro/build-game-pack.py; then
            python3 -I scripts/balatro/build-game-pack.py --check
          else
            echo "build-game-pack.py has no --check yet (WS2); skipping."
          fi

      # Bundle budget (PLAN §6.4, WS14 adds the script).
      - name: Bundle budget
        if: hashFiles('scripts/balatro/bundle-budget.ts') != ''
        run: node_modules/.bin/tsx scripts/balatro/bundle-budget.ts

  # End-to-end (PLAN §6.1, §6.3; WS14). Three vitest projects of
  # vitest.balatro-e2e.config.ts, cheapest first:
  #  - harness: unit tests of the e2e machinery (no browser);
  #  - engine:  Lua L2 — lib/balatro/lua/mp_test/specs/*_spec.lua inside the real
  #             love.wasm, headless Chromium on SwiftShader, static harness page
  #             (no DB, no hub). A hard gate;
  #  - match:   multi-browser matches against a throwaway Postgres + the hub +
  #             `vite dev` (VITE_BALATRO_MP_TEST=1), signed-in accounts made through
  #             the sign-up API. BALATRO_E2E_REQUIRE_MATCH=1 turns "no stack" into a
  #             failure instead of a skip.
  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rmh
      BETTER_AUTH_SECRET: ci-balatro-e2e-not-a-real-secret-000000000
      BALATRO_E2E_LOG_DIR: ${{ github.workspace }}/balatro-e2e-logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Postgres starts in the background while dependencies install (as web-ci.yml's integration job).
      - name: Start Postgres (background)
        run: |
          nohup sh -c 'docker run -d --name pg -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=rmh \
            pgvector/pgvector:pg16' > "$RUNNER_TEMP/pg-start.log" 2>&1 &

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E machinery (harness project)
        run: pnpm test:balatro:e2e --project harness

      - name: In-engine specs (engine project)
        run: pnpm test:balatro:e2e --project engine

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 60); do
            if docker exec pg pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1; then echo "postgres ready"; exit 0; fi
            sleep 1
          done
          echo "postgres never became ready"; cat "$RUNNER_TEMP/pg-start.log"; docker logs pg 2>&1 | tail -40 || true
          exit 1

      - name: Migrate database
        run: pnpm exec prisma migrate deploy

      - name: Matches (match project)
        env:
          BALATRO_E2E_REQUIRE_MATCH: '1'
        run: pnpm test:balatro:e2e --project match

      - name: Stack logs (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: balatro-e2e-logs
          path: balatro-e2e-logs
          if-no-files-found: ignore
