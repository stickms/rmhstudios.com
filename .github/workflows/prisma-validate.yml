# ─────────────────────────────────────────────────────────────────────────────
# Prisma schema validation. `prisma validate` parses schema.prisma + prisma.config
# and checks relations, attributes, and datasource config are well-formed. No live
# database is contacted (a dummy DATABASE_URL satisfies the datasource block).
# ─────────────────────────────────────────────────────────────────────────────
name: prisma-validate

on:
  pull_request:
    paths:
      - "prisma/**"
      - "prisma.config.ts"
      - ".github/workflows/prisma-validate.yml"
  push:
    branches: [main]
    paths:
      - "prisma/**"
      - "prisma.config.ts"
  workflow_dispatch: {}

concurrency:
  group: prisma-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rmh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm

      # postinstall runs `prisma generate` (schema-only, no DB needed).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm exec prisma validate
