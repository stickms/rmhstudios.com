name: synthetic-perf

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

concurrency:
  group: synthetic-perf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Run synthetic Lighthouse probes
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p .lighthouseci
          runs="$(node -p "require('./scripts/ci/synthetic-perf-bands.json').lighthouseRuns")"
          urls=()
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            urls+=("--url=$url")
          done < <(node -e "const c=require('./scripts/ci/synthetic-perf-bands.json');for(const u of c.urls) console.log(u.url)")
          [ "${#urls[@]}" -gt 0 ]
          npx -y @lhci/cli@0.15.1 collect \
            "${urls[@]}" \
            --numberOfRuns="$runs" \
            --settings.chromeFlags="--headless=new --no-sandbox"

      - name: Report regression bands (advisory)
        run: node scripts/ci/synthetic-perf-report.mjs --warn-only

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-perf-lighthouse
          path: .lighthouseci
          if-no-files-found: warn
          retention-days: 14

  cloudflare-cache-rule-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Verify Cloudflare cache-rule drift
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          VERIFY_ONLY: '1'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "::notice::Cloudflare drift check skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ZONE_ID."
            exit 0
          fi
          bash deploy/apply-cloudflare-cache-rules.sh
