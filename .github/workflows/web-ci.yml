# ─────────────────────────────────────────────────────────────────────────────
# Frontend CI gate — the standard local checks on every PR and push, so a broken
# frontend change can't land silently. No secrets/env required.
#
# Split into PARALLEL jobs (typecheck / test / build / audit) that each do their
# own frozen install off the shared pnpm store cache (~10s warm). This means:
#   • the full production Build runs on EVERY PR regardless of the test result —
#     it used to sit AFTER the test step in one job, so a red test (once, a
#     long-lived i18n-catalogs drift) skipped it and pre-merge build breakage
#     slipped through to the deploy. That separation is also what let the test
#     step go back to being a hard gate in the 2026-08-08 testing audit;
#   • wall-clock ≈ the slowest single job (~the build), not the sum of all four.
#
# `typecheck` was split out of the old combined `check` job on 2026-08-08. It was
# 54s of that job's 2m07s and ran SERIALLY ahead of lint/docs/test, which made
# `check` the PR gate's long pole — longer than the production build (1m38s) it
# is supposed to be cheaper than. The split is worth a whole extra runner here
# and NOT in deploy.yml (see the note on that job) because on a PR this is the
# critical path, and on a deploy it is not.
#
# The typecheck cost is real work, not a cold cache — measured locally against
# this tree: 91s cold, 8s warm with no changes, 34s warm after editing one
# widely-imported module (`lib/utils.ts`). CI's ~54s is a merge commit's genuine
# downstream cone, so there is no cache bug to fix and parallelism is the only
# remaining lever.
# ─────────────────────────────────────────────────────────────────────────────
name: web-ci

on:
  pull_request:
    paths-ignore:
      - 'go-services/**'
      - 'deploy/**'
      - 'docs/**'
      - '**/*.md'
  # NOTE: intentionally NO `push:` trigger. On a push to main, deploy.yml already
  # runs the SAME typecheck/lint/test as its in-workflow `ci` job AND builds the
  # real Docker image (which catches any build-time breakage) — so a push-run of
  # web-ci here was a pure duplicate of ~3 jobs. Under the account-wide concurrent
  # runner cap that duplicate could queue AHEAD of deploy's `build`, delaying the
  # release. PRs are still fully gated below; main is reached only via PR, so the
  # checks have already run on the PR head. (`audit` likewise ran on the PR.)
  workflow_dispatch: {}

# Newer pushes to the same ref cancel older in-progress runs.
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repo (checkout) to typecheck/lint/test/build.
permissions:
  contents: read

jobs:
  # Typecheck, alone. tsc exceeds Node's default ~4 GB heap, so the larger heap
  # is set job-wide.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      # Node 24.18.0 to match the production Dockerfile. Node < 21
      # lacks the global `navigator`, which build-vibe-packages needs to import
      # browser-only libs (pixi.js, p5) for their export names.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      # postinstall runs `prisma generate` (schema-only, no DB needed).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Persist tsc's incremental program graph (.tsbuildinfo) across runs so warm
      # runs only re-check files that actually changed. Keyed per-commit with a
      # prefix restore-key, so each run restores the most recent cache and saves a
      # fresh one. tsc invalidates entries by file CONTENT (it hashes), so a
      # restored cache can only ever make the check FASTER, never wrong.
      #
      # The tsc and eslint caches are SEPARATE entries (they used to share one
      # `tsc-eslint-*` key holding both dirs) because they are now claimed by
      # different jobs — two jobs writing one key just race, and one job
      # restoring a 2-in-1 entry downloads a cache it half-ignores. deploy.yml's
      # `ci` job takes both, so `main` keeps publishing both prefixes and a PR's
      # first run still restores warm off the base branch. The old combined
      # entries age out on their own; expect one cold run per prefix after this
      # lands.
      - name: Restore typecheck cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/tsc
          key: tsc-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ runner.os }}-
      # `mkdir -p` so a cold cache (miss on the restore above) still has the dir
      # tsc writes its cache file into.
      # `pnpm run typecheck` runs the NATIVE (Go) TypeScript compiler, which
      # typechecks this repo in ~91s cold / ~8s warm / ~34s after a change to a
      # widely-imported module (all measured 2026-08-08), against ~218s / ~17s
      # for the JavaScript compiler, with identical results. It is invoked by
      # explicit path in the script because `typescript` and `typescript-native`
      # both ship a `tsc` bin. `typescript` 5.9 stays installed — typescript-eslint
      # imports the compiler API from it, and TS 7 does not expose one.
      - name: Typecheck
        run: |
          mkdir -p .cache/tsc
          pnpm run typecheck

  # Lint + generated-docs freshness + the unit suite. Split from `typecheck`
  # (2026-08-08) so the two run concurrently instead of serially; together they
  # were the PR gate's long pole. vitest also wants the larger heap.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # eslint's result cache — its own entry, see the note in `typecheck`.
      # `--cache-strategy content` means a restored cache invalidates by file
      # content, so it can only make the run faster, never wrong.
      - name: Restore lint cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/eslint
          key: eslint-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-
      - name: Lint
        run: |
          mkdir -p .cache/eslint
          pnpm exec eslint --cache --cache-location .cache/eslint/eslintcache --cache-strategy content
      # The developer-API reference and the site inventory under docs/ are
      # generated from lib/api/registry.ts, lib/games.ts, lib/apps.ts and the
      # route tree. Regenerating and diffing is the only way a registry change
      # can't ship with a stale published reference.
      - name: Docs freshness
        run: |
          pnpm run docs:api:check
          pnpm run docs:site:check
      # A HARD GATE again, as of the 2026-08-08 testing audit.
      #
      # This step was `continue-on-error: true` because `i18n-catalogs` was
      # permanently red and a blocking test step meant the `build` job never
      # ran on a PR. Both halves of that are gone: the catalogs test passes,
      # `build` is its own job so a red test cannot hide a build failure, and
      # the suite is green (248 files / ~6k tests after the 2026-08-08 testing
      # audit narrowed it to mission-critical scope). An advisory test step is
      # a suite nobody has to keep green — which is how the permanently-red
      # test got to stay permanently red. If this goes red, fix the test.
      - name: Test
        run: pnpm test

  # Full frontend build (vibe packages → vite). Catches build-time breakage that
  # typecheck alone misses. Runs independently of `check` so a red test never
  # hides a build failure. No runtime env is read at build time.
  #
  # The two size gates below (OPT-01/OPT-02, docs/optimization-ideas-2026-08-05.md)
  # measure THIS job's output — deliberately no second build, since CI wall-clock
  # is a tracked concern (docs/ci-speed-audit-2026-07-17.md §3).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # `--sourcemap` (vs the plain `build:frontend`) is what lets the
      # entry-composition gate attribute chunk bytes back to a package: the
      # client build is minified with no module boundaries left in it, so
      # `<chunk>.js.map` is the only way to know what is inside a chunk. Same
      # single build otherwise; the maps are never uploaded or deployed.
      - name: Build with Vite 8
        run: pnpm run build:frontend:sourcemap
      # OPT-01 — the critical path (transitive STATIC closure of the client
      # entry) must stay inside its budget. Sourcemap comments are stripped
      # before measuring, so these numbers match a production build.
      - name: Bundle budget
        run: pnpm run check:bundle-budget
      # OPT-02 — catches the CAUSE rather than the bytes: a package that must
      # never be in the entry closure. `--strict` makes a missing sourcemap a
      # failure rather than a skip, so this can never silently no-op in CI.
      - name: Entry-chunk composition
        run: pnpm exec tsx scripts/check-entry-composition.ts --strict

  # Production dependency vulnerability audit. Fast; kept separate so it never
  # gates (or is gated by) the build/test.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high
