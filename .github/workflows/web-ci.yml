# Required checks report on every PR, including changes with no frontend artifact.
name: web-ci

on:
  pull_request:
  # GitHub merge queue: the exact merge result is tested before it lands on main.
  merge_group:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.classify.outputs.checks }}
      frontend: ${{ steps.classify.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Classify the complete PR change
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node .github/scripts/classify-change.mjs

  build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-deps
      - name: Restore image variants
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: public/images/_variants
          key: image-variants-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/gen-image-variants.ts', 'scripts/media/pnpm-lock.yaml') }}-${{ hashFiles('public/images/**') }}
          restore-keys: |
            image-variants-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/gen-image-variants.ts', 'scripts/media/pnpm-lock.yaml') }}-
      - name: Build with Vite 8
        run: pnpm run build:frontend:sourcemap
      - name: Bundle budget
        run: pnpm run check:bundle-budget
      - name: Entry-chunk composition
        run: pnpm exec tsx scripts/check-entry-composition.ts --strict

      - name: Archive checked frontend for nightly browser checks
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: tar -cf checked-frontend.tar .output
      - name: Retain checked frontend
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked-frontend
          path: checked-frontend.tar
          compression-level: 0
          retention-days: 1

  # typecheck / lint / docs freshness / unit shards / audit / integration are
  # defined once in ci-checks.yml (deploy.yml calls the same file).
  checks:
    needs: changes
    uses: ./.github/workflows/ci-checks.yml
    with:
      checks: ${{ needs.changes.outputs.checks == 'true' }}
      frontend: ${{ needs.changes.outputs.frontend == 'true' }}
    permissions:
      contents: read

  # Steel section 17: the site tier is at rest (no pending frame, one WebGL context, no worker on `/`, `/terms`,
  # `/settings`) and the phone globe opens and closes (testing/e2e/steel-rest.mjs). Runs against the checked build, on
  # the nightly and manual runs, as the browser jobs it replaces did.
  steel-rest:
    needs: build
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rmh
      BETTER_AUTH_SECRET: ci-steel-rest-not-a-real-secret-000000000000
      BETTER_AUTH_URL: http://localhost:7005
      PORT: '7005'
      BASE_URL: http://localhost:7005
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rmh
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-deps
      - name: Restore the checked build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: checked-frontend
      - name: Extract the checked build
        run: tar -xf checked-frontend.tar
      - name: Migrate database
        run: pnpm exec prisma migrate deploy
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start the built server
        run: |
          nohup node .output/server/index.mjs > "$RUNNER_TEMP/steel-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/steel-server.pid"
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "$BASE_URL/"; then echo "server up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "server did not come up"; tail -50 "$RUNNER_TEMP/steel-server.log"; exit 1
      - name: Steel rest and globe check
        run: node testing/e2e/steel-rest.mjs
      - name: Server log (on failure)
        if: failure()
        run: tail -100 "$RUNNER_TEMP/steel-server.log" 2>/dev/null || true
      - name: Stop the server
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/steel-server.pid" 2>/dev/null)" 2>/dev/null || true

  migrations:
    needs: changes
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    # 10, not 5: the check itself takes <1s, but this job used to clone the full
    # history and sat within a minute of the old limit (checkout 35s-4m33s),
    # so a slow runner failed required-checks for a reason unrelated to the PR.
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      # The script runs `git diff base HEAD -- prisma/migrations`, a two-tree diff
      # that needs those two commits' trees and the new migration files, nothing
      # else. A plain depth-1 checkout still fetched the whole 19k-file tree and
      # took 7m49s in one run while the same fetch took 20-60s in sibling jobs
      # (server-side pack generation), so fetch trees only (blobless) and
      # materialise just the two paths the job reads (.git is ~4 MB, not ~500).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/scripts
            prisma/migrations
      - name: Fetch the base commit
        run: git fetch --no-tags --depth=1 --filter=blob:none origin "$BASE_SHA"
      - name: New migrations must stay rollback-compatible (expand/contract)
        run: node .github/scripts/check-migrations-additive.mjs

  required-checks:
    needs: [changes, checks, build, migrations]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every applicable prerequisite
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const needs = JSON.parse(process.env.RESULTS);
          if (needs.changes.result !== 'success') throw new Error('Change classification failed');
          if (needs.migrations.result !== 'success') throw new Error('migrations: ' + needs.migrations.result);
          // `checks` = ci-checks.yml. It is called on every PR (a reusable workflow has no
          // job-level `if` here) and its own verdict job enforces the per-job expectations,
          // skipping included, so it must succeed whatever changed. Expecting 'skipped' on a
          // docs-only PR failed every such PR.
          if (needs.checks.result !== 'success') throw new Error('checks: ' + needs.checks.result);
          const expected = needs.changes.outputs.frontend === 'true' ? 'success' : 'skipped';
          if (needs.build.result !== expected) throw new Error('build: ' + needs.build.result + ' (expected ' + expected + ')');
          NODE

  payload-diagnostics:
    needs: build
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group' && !inputs.update-baselines
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-deps
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: checked-frontend
      - run: tar -xf checked-frontend.tar
      - name: Report the whole lazy JavaScript surface (outside the release gate)
        run: pnpm exec tsx scripts/ci/bundle-budget.ts
