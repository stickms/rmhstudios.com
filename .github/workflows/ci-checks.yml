# The single definition of the check jobs shared by web-ci (PR / merge queue /
# nightly) and deploy (push to main). Callers choose which half runs:
#   checks:   typecheck + lint + docs freshness, lint ratchets, unit shards, production audit
#   frontend: build + integration suite against a throwaway Postgres
# and two options for the integration job's build (web-ci sets both):
#   bundle-checks: build with sourcemaps and run the bundle budget + entry-composition
#                  gates on it, so a PR builds the frontend once, not twice
#   retain-build:  upload that build as `checked-frontend` for web-ci's nightly browser jobs
# `verdict` fails the call if a job that should have run was skipped, or any
# job failed, so a caller only has to require this one result.
name: ci-checks

on:
  workflow_call:
    inputs:
      checks:
        type: boolean
        required: true
      frontend:
        type: boolean
        required: true
      bundle-checks:
        type: boolean
        default: false
      retain-build:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  typecheck:
    if: inputs.checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-deps
      # The typecheck is incremental, but "incremental" is not "small": a restored build info only helps for the
      # files that did not change, and a change to the generated Prisma client (any edit to prisma/schema)
      # makes TypeScript recheck most of the project. Both cases can need 12+ GB at full speed, which a 16 GB
      # runner cannot hold (PR 1787's run thrashed for 30 minutes and was cancelled; a local run with a
      # restored cache and a changed schema was killed for memory after 4 minutes). So EVERY run is
      # single-threaded under a Go memory limit: measured cold at ~2.7 min and ~10.8 GB, and it is what
      # finished every time. A normal incremental run is much faster than that.
      # Pull requests only RESTORE the cache. Saving is left to main (and the nightly), so a PR push does not add
      # an entry, and the newest entry any PR can find is always a main build.
      - name: Restore typecheck cache
        id: tsc-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/tsc
          key: tsc-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ runner.os }}-
      - name: Typecheck
        # Far longer than a cold run needs (~5 min with setup), far shorter than the 30 it used to hang for.
        timeout-minutes: 12
        run: |
          mkdir -p .cache/tsc
          if [ -f .cache/tsc/site.tsbuildinfo ]; then
            echo "Typecheck cache restored (${{ steps.tsc-cache.outputs.cache-matched-key }}): incremental run."
          else
            echo "::warning::No typecheck cache was restored: this run checks the whole project."
          fi
          GOMEMLIMIT=6GiB GOGC=25 node node_modules/typescript-native/bin/tsc -b --singleThreaded
      - name: Save typecheck cache
        if: success() && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/tsc
          key: tsc-${{ runner.os }}-${{ github.sha }}
      - name: Typecheck (strict islands)
        run: pnpm run typecheck:strict
      - name: Restore lint cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/eslint
          key: eslint-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-
      - name: Lint
        run: |
          mkdir -p .cache/eslint
          pnpm exec eslint --cache --cache-location .cache/eslint/eslintcache --cache-strategy content
      - name: Docs freshness
        run: |
          pnpm run docs:api:check
          pnpm run docs:site:check
          pnpm run prepaint:check
          pnpm run sdk:check

  # The two ESLint ratchets took ~2.5 min at the end of the typecheck job, after tsc, so that job ran
  # ~5 min end to end. They need nothing tsc produces, so they run beside it here.
  ratchets:
    if: inputs.checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-deps
      # import-x/no-cycle depends on other files, so the architecture ratchet is never cached. The
      # jsx-a11y rules are per file, and that count is cached by content (scripts/count-jsx-a11y.mjs).
      - name: Restore jsx-a11y cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/eslint-a11y
          key: eslint-a11y-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            eslint-a11y-${{ runner.os }}-
      - name: Architecture ratchet (import cycles + layer boundaries)
        run: pnpm run lint:ratchet
      - name: Accessibility ratchet (jsx-a11y findings only go down)
        run: pnpm run a11y:ratchet

  test:
    if: inputs.checks
    # Three shards, not two: at two, vitest's file split left one shard at 92 s of tests and
    # the other at 42 s (web-ci run 44451063929), so the slow one set the job's end.
    name: test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-deps
      # lib/i18n/__tests__/runtime-parity.test.ts compares the site's translation
      # runtime with i18next on every catalog of every shipped locale.
      - name: Pull translation catalogs
        run: bash scripts/i18n-pull.sh
      - name: Test
        run: pnpm test --shard=${{ matrix.shard }}/3

  audit:
    if: inputs.checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-deps
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

  integration:
    if: inputs.frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rmh
      BETTER_AUTH_SECRET: ci-integration-not-a-real-secret-00000000000
      BETTER_AUTH_URL: http://localhost:7005
      PORT: '7005'
      # A placeholder, not a secret: the app derives the RMH Med Schools sharing hashes with it (sharing is off without
      # one), and testing/integration/medschools-private.test.ts recomputes them from the same value.
      MEDSCHOOLS_DEDUPE_SECRET: ci-integration-medschools-dedupe-0123456789
      INTEGRATION_BASE_URL: http://localhost:7005
      # The table store for testing/integration/casino-restart.test.ts. Not REDIS_STATE_URL:
      # the web app under test must not read it.
      INTEGRATION_REDIS_STATE_URL: redis://127.0.0.1:6379
      # Placeholders, not secrets: the Stripe webhook test signs events with this
      # secret and the server verifies them with it. No Stripe key is set, so
      # neither the app nor a test can reach api.stripe.com.
      STRIPE_WEBHOOK_SECRET: whsec_ci_integration_not_a_real_secret
      STRIPE_STARTER_PRICE_ID: price_ci_starter
      STRIPE_PRO_PRICE_ID: price_ci_pro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start Postgres (background)
        run: |
          nohup sh -c 'docker run -d --name pg -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=rmh \
            pgvector/pgvector:pg16' > "$RUNNER_TEMP/pg-start.log" 2>&1 &
      - name: Start Redis (background)
        run: |
          nohup sh -c 'docker run -d --name redis-state -p 127.0.0.1:6379:6379 \
            redis:7.4-alpine redis-server --appendonly yes --maxmemory-policy noeviction' > "$RUNNER_TEMP/redis-start.log" 2>&1 &
      - uses: ./.github/actions/setup-deps
      - name: Restore image variants
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: public/images/_variants
          key: image-variants-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/gen-image-variants.ts', 'scripts/media/pnpm-lock.yaml') }}-${{ hashFiles('public/images/**') }}
          restore-keys: |
            image-variants-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/gen-image-variants.ts', 'scripts/media/pnpm-lock.yaml') }}-
      # One build feeds both gates (scripts/check-entry-composition.ts): the entry-composition
      # guard needs sourcemaps, and the bundle budget strips the map comments before measuring.
      - name: Build
        run: pnpm run ${{ inputs.bundle-checks && 'build:frontend:sourcemap' || 'build:frontend' }}
      - name: Bundle budget
        if: inputs.bundle-checks
        run: pnpm run check:bundle-budget
      - name: Entry-chunk composition
        if: inputs.bundle-checks
        run: pnpm exec tsx scripts/check-entry-composition.ts --strict
      - name: Archive checked frontend for nightly browser checks
        if: inputs.retain-build
        run: tar -cf checked-frontend.tar .output
      - name: Retain checked frontend
        if: inputs.retain-build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked-frontend
          path: checked-frontend.tar
          compression-level: 0
          retention-days: 1
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 60); do
            if docker exec pg pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1; then echo "postgres ready (${i}s into the wait)"; exit 0; fi
            sleep 1
          done
          echo "postgres never became ready"; cat "$RUNNER_TEMP/pg-start.log"; docker logs pg 2>&1 | tail -40 || true
          exit 1
      - name: Migrate database
        run: pnpm exec prisma migrate deploy
      - name: Wait for Redis
        run: |
          for i in $(seq 1 60); do
            if docker exec redis-state redis-cli ping 2>/dev/null | grep -q PONG; then echo "redis ready (${i}s into the wait)"; exit 0; fi
            sleep 1
          done
          echo "redis never became ready"; cat "$RUNNER_TEMP/redis-start.log"; docker logs redis-state 2>&1 | tail -40 || true
          exit 1
      - name: Start the built server
        run: |
          nohup node .output/server/index.mjs > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "$INTEGRATION_BASE_URL/api/ready"; then echo "server ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "server did not become ready"
          tail -80 "$RUNNER_TEMP/server.log"
          exit 1
      - name: Integration tests
        run: pnpm test:integration
      - name: Server log (on failure)
        if: failure()
        run: tail -200 "$RUNNER_TEMP/server.log" || true
      - name: Stop the server
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null || true

  verdict:
    needs: [typecheck, ratchets, test, audit, integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every applicable job ran and passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          CHECKS: ${{ inputs.checks }}
          FRONTEND: ${{ inputs.frontend }}
        run: |
          node --input-type=module <<'NODE'
          const needs = JSON.parse(process.env.RESULTS);
          const want = { typecheck: 'CHECKS', ratchets: 'CHECKS', test: 'CHECKS', audit: 'CHECKS', integration: 'FRONTEND' };
          for (const [name, flag] of Object.entries(want)) {
            const expected = process.env[flag] === 'true' ? 'success' : 'skipped';
            if (needs[name].result !== expected) throw new Error(name + ': ' + needs[name].result + ' (expected ' + expected + ')');
          }
          NODE
