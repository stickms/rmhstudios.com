# The single definition of the check jobs shared by web-ci (PR / merge queue /
# nightly) and deploy (push to main). Callers choose which half runs:
#   checks:   typecheck + lint + docs freshness, unit shards, production audit
#   frontend: build + integration suite against a throwaway Postgres
# `verdict` fails the call if a job that should have run was skipped, or any
# job failed, so a caller only has to require this one result.
name: ci-checks

on:
  workflow_call:
    inputs:
      checks:
        type: boolean
        required: true
      frontend:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  typecheck:
    if: inputs.checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-deps
      - name: Restore typecheck cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/tsc
          key: tsc-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ runner.os }}-
      - name: Typecheck
        run: |
          mkdir -p .cache/tsc
          pnpm run typecheck
      - name: Restore lint cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/eslint
          key: eslint-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-
      - name: Lint
        run: |
          mkdir -p .cache/eslint
          pnpm exec eslint --cache --cache-location .cache/eslint/eslintcache --cache-strategy content
      - name: Architecture ratchet (import cycles + layer boundaries)
        run: pnpm run lint:ratchet
      - name: Docs freshness
        run: |
          pnpm run docs:api:check
          pnpm run docs:site:check
          pnpm run sdk:check

  test:
    if: inputs.checks
    name: test (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-deps
      - name: Test
        run: pnpm test --shard=${{ matrix.shard }}/2

  audit:
    if: inputs.checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-deps
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

  integration:
    if: inputs.frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rmh
      BETTER_AUTH_SECRET: ci-integration-not-a-real-secret-00000000000
      BETTER_AUTH_URL: http://localhost:7005
      PORT: '7005'
      INTEGRATION_BASE_URL: http://localhost:7005
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start Postgres (background)
        run: |
          nohup sh -c 'docker run -d --name pg -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=rmh \
            pgvector/pgvector:pg16' > "$RUNNER_TEMP/pg-start.log" 2>&1 &
      - uses: ./.github/actions/setup-deps
      - name: Restore image variants
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: public/images/_variants
          key: image-variants-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/gen-image-variants.ts', 'scripts/media/pnpm-lock.yaml') }}-${{ hashFiles('public/images/**') }}
          restore-keys: |
            image-variants-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/gen-image-variants.ts', 'scripts/media/pnpm-lock.yaml') }}-
      - name: Build
        run: pnpm run build:frontend
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 60); do
            if docker exec pg pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1; then echo "postgres ready (${i}s into the wait)"; exit 0; fi
            sleep 1
          done
          echo "postgres never became ready"; cat "$RUNNER_TEMP/pg-start.log"; docker logs pg 2>&1 | tail -40 || true
          exit 1
      - name: Migrate database
        run: pnpm exec prisma migrate deploy
      - name: Start the built server
        run: |
          nohup node .output/server/index.mjs > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "$INTEGRATION_BASE_URL/api/ready"; then echo "server ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "server did not become ready"
          tail -80 "$RUNNER_TEMP/server.log"
          exit 1
      - name: Integration tests
        run: pnpm test:integration
      - name: Server log (on failure)
        if: failure()
        run: tail -200 "$RUNNER_TEMP/server.log" || true
      - name: Stop the server
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null || true

  verdict:
    needs: [typecheck, test, audit, integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every applicable job ran and passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          CHECKS: ${{ inputs.checks }}
          FRONTEND: ${{ inputs.frontend }}
        run: |
          node --input-type=module <<'NODE'
          const needs = JSON.parse(process.env.RESULTS);
          const want = { typecheck: 'CHECKS', test: 'CHECKS', audit: 'CHECKS', integration: 'FRONTEND' };
          for (const [name, flag] of Object.entries(want)) {
            const expected = process.env[flag] === 'true' ? 'success' : 'skipped';
            if (needs[name].result !== expected) throw new Error(name + ': ' + needs[name].result + ' (expected ' + expected + ')');
          }
          NODE
