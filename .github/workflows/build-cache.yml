name: build-cache
on:
  workflow_call: {}
  workflow_dispatch: {}
  schedule:
    - cron: '41 5 * * *'
permissions:
  contents: read
  packages: write
concurrency:
  group: reusable-production-cache
  cancel-in-progress: false
jobs:
  reusable-stages:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.ARM64_BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # Fingerprints are BuildKit's complete input graph, not HEAD^1. An earlier
      # cancelled update therefore cannot leave the cache permanently stale.
      - name: Publish reusable stage caches (no Vite build)
        run: docker buildx bake -f docker-bake.hcl cache-deps cache-prisma cache-prod cache-media cache-vibe cache-go
