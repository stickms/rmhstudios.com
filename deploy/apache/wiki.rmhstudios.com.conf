# ─────────────────────────────────────────────────────────────────────────────
# Apache vhost for wiki.rmhstudios.com (production VPS).
#
# Source-of-truth copy. The live file is /etc/apache2/sites-available/
# wiki.rmhstudios.com.conf on the VPS — keep them in sync. TLS is terminated
# by Cloudflare, so Apache listens on :80 only.
#
# The wiki is Wiki.js 2, served by the `wikijs` Docker service (see
# docker-compose.yml and docs/wiki.md). Everyone can read it; its pages are
# managed by site admins from rmhstudios.com/admin/wiki, which talks to Wiki.js
# over the compose network, not through this vhost.
#
# Install:
#   sudo cp deploy/apache/wiki.rmhstudios.com.conf \
#           /etc/apache2/sites-available/wiki.rmhstudios.com.conf
#   sudo a2ensite wiki.rmhstudios.com
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# Required modules (already enabled for the main vhost):
#   proxy proxy_http proxy_wstunnel headers
#
# DNS: an A/CNAME record for wiki.rmhstudios.com pointing at the same
# Cloudflare-proxied origin as rmhstudios.com (deploy/terraform/dns.tf).
# ─────────────────────────────────────────────────────────────────────────────

# Upstream port for the wiki (docker-compose `wikijs`, published on 127.0.0.1).
# Overridable, falls back to the default 7010.
<IfDefine !WIKI_UPSTREAM_PORT>
    Define WIKI_UPSTREAM_PORT 7010
</IfDefine>

<VirtualHost *:80>
    ServerName wiki.rmhstudios.com

    # ── Security headers (defense-in-depth) ──
    # TLS is terminated at Cloudflare; these are forwarded to the client.
    # No Content-Security-Policy here: Wiki.js ships its own inline scripts and
    # the main site's policy would break its editor and admin area.
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Permitted-Cross-Domain-Policies "none"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()"

    # Wiki.js builds absolute links from the forwarded scheme; Cloudflare speaks
    # HTTPS to the visitor and HTTP to us.
    RequestHeader set X-Forwarded-Proto "https"

    # ── Proxy everything to the wiki ──
    ProxyPreserveHost On
    ProxyRequests Off
    # The admin area's live updates are GraphQL subscriptions over a WebSocket.
    ProxyPass        /graphql-subscriptions http://localhost:${WIKI_UPSTREAM_PORT}/graphql-subscriptions upgrade=websocket retry=0
    ProxyPass        / http://localhost:${WIKI_UPSTREAM_PORT}/ retry=0
    ProxyPassReverse / http://localhost:${WIKI_UPSTREAM_PORT}/

    ErrorLog  ${APACHE_LOG_DIR}/wiki.rmhstudios.log
    CustomLog ${APACHE_LOG_DIR}/wiki.rmhstudios.log combined
</VirtualHost>
