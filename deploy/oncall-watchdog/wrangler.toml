# rmh on-call watchdog — deploy with:
#   npx wrangler@4 deploy --config deploy/oncall-watchdog/wrangler.toml
# Setup order (Access gate BEFORE the VPS sends anything): see README.md.

name = "rmh-oncall-watchdog"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Reachable ONLY through the custom domain, where the Access policy on /v1/*
# applies. No *.workers.dev URL, no preview URLs.
workers_dev = false
preview_urls = false
routes = [{ pattern = "oncall.rmhstudios.com", custom_domain = true }]

[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "ONCALL_STATE"
class_name = "OncallState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OncallState"]

[observability]
enabled = true

# Not secret. Secrets (DISCORD_BOT_TOKEN, ONCALL_WEBHOOK_URL) go in via
# `wrangler secret put`, never in this file.
[vars]
SITE_URL = "https://rmhstudios.com"
STATUS_URL = "https://status.rmhstudios.com"
RUNBOOK_BASE = "https://github.com/stickms/rmhstudios.com/blob/main/docs/runbooks/oncall"
ONCALL_ROLE_ID = "1562519841837949010"
# Fill in from the Discord developer portal / channel (Developer Mode → Copy ID):
DISCORD_APPLICATION_ID = ""
DISCORD_PUBLIC_KEY = ""
ONCALL_CHANNEL_ID = ""
ESCALATION_ROLE_ID = ""
# Cloudflare Zero Trust → Access → the "rmh oncall /v1" application:
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
ACCESS_CLIENT_ID = ""
