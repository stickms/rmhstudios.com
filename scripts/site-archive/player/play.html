<!doctype html>
<!--
  The site-archive player, published to the CDN at /site-archive/play.html beside ReplayWeb.page's ui.js and sw.js and the
  recordings (scripts/site-archive/publish.mjs). /site-history frames it as
  https://cdn.rmhstudios.com/site-archive/play.html?v=<version id>&path=<path>.

  It lives on the CDN origin on purpose: the old builds' scripts run here, so they can never read the live site's
  cookies or call its API with a visitor's session.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>RMH Studios archive</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d10; color: #d6d8dc; font: 14px/1.45 system-ui, sans-serif; }
      replay-web-page { display: block; width: 100%; height: 100%; }
      #msg[hidden] { display: none; }
      #msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; }
    </style>
    <script src="ui.js"></script>
  </head>
  <body>
    <div id="msg" hidden></div>
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        var v = q.get('v') || '';
        var path = q.get('path') || '/';
        var msg = document.getElementById('msg');
        if (!/^[a-z0-9-]{1,80}$/.test(v) || path.charAt(0) !== '/') {
          msg.hidden = false;
          msg.textContent = 'This version is not in the archive.';
          return;
        }
        // The recording format number matches RECORDINGS in scripts/site-archive/publish.ts.
        var source = new URL('versions/v2/' + v + '.warc.gz', location.href).href;
        // A version listed on /site-history before CI has recorded it: say so rather than show the player's error.
        fetch(source, { method: 'HEAD' })
          .then(function (r) {
            if (!r.ok) throw new Error(String(r.status));
            start(source);
          })
          .catch(function () {
            msg.hidden = false;
            msg.textContent = 'This version has not been recorded yet. Try again later.';
          });
      })();

      function start(source) {
        var q = new URLSearchParams(location.search);
        var path = q.get('path') || '/';
        var el = document.createElement('replay-web-page');
        el.setAttribute('source', source);
        el.setAttribute('url', 'http://rmhstudios.com' + path);
        el.setAttribute('replaybase', new URL('./', location.href).pathname);
        el.setAttribute('embed', 'replayonly');
        el.setAttribute('loading', 'eager');
        document.body.appendChild(el);
      }
    </script>
  </body>
</html>
