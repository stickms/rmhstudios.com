<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hearthworks model verifier</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; background: #202226; color: #ddd; font: 12px monospace; }
    canvas { display: block; }
  </style>
  <script type="importmap">
    { "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
  </script>
</head>
<body>
<script type="module">
  // Headless verifier page (driven by render.mjs): loads a GLB the way the game's runtime will (three GLTFLoader),
  // plays named clips and returns filmstrips / contact sheets as PNG data URLs.
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

  const loader = new GLTFLoader();
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setClearColor(0x2b2e34, 1);
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x555560, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(2, 4, 3);
  scene.add(sun);
  const floor = new THREE.GridHelper(4, 16, 0x666a70, 0x44474d);
  scene.add(floor);

  const cache = new Map();
  async function load(url) {
    if (!cache.has(url)) cache.set(url, await loader.loadAsync(url));
    return cache.get(url);
  }

  function frame(model, view, size, height, focusY = 0.52, dist = 3.1) {
    const cam = new THREE.PerspectiveCamera(28, 1, 0.05, 50);
    const d = height * dist;
    const c = new THREE.Vector3(0, height * focusY, 0);
    const dir = { front: [0, 0.05, 1], side: [1, 0.05, 0], back: [0, 0.05, -1], three: [0.7, 0.12, 0.7] }[view] || [0, 0, 1];
    cam.position.copy(c).add(new THREE.Vector3(...dir).normalize().multiplyScalar(d));
    cam.lookAt(c);
    return cam;
  }

  // draw `jobs` ([{clip, time, view}]) as a grid row-major, `cols` per row, size px each
  window.filmstrip = async ({ url, height, jobs, cols, size, focusY, dist }) => {
    const gltf = await loader.loadAsync(url); // fresh copy: a mixer leaves bones in the last pose it evaluated
    const root = gltf.scene;
    scene.add(root);
    const mixer = new THREE.AnimationMixer(root);
    const clips = Object.fromEntries(gltf.animations.map((a) => [a.name, a]));
    renderer.setSize(size, size);
    const rows = Math.ceil(jobs.length / cols);
    const sheet = document.createElement('canvas');
    sheet.width = cols * size;
    sheet.height = rows * size;
    const ctx = sheet.getContext('2d');
    ctx.font = '11px monospace';
    jobs.forEach((job, i) => {
      mixer.stopAllAction();
      mixer.setTime(0);
      if (job.clip && clips[job.clip]) {
        const act = mixer.clipAction(clips[job.clip]);
        act.play();
        mixer.setTime(job.time);
      }
      root.updateMatrixWorld(true);
      renderer.render(scene, frame(root, job.view || 'front', size, height, focusY, dist));
      const x = (i % cols) * size, y = Math.floor(i / cols) * size;
      ctx.drawImage(renderer.domElement, x, y);
      ctx.fillStyle = '#fff';
      ctx.fillText(job.label ?? `${job.clip || 'rest'} ${job.time != null ? job.time.toFixed(2) : ''} ${job.view || ''}`, x + 4, y + 12);
    });
    scene.remove(root);
    return sheet.toDataURL('image/png');
  };

  // clip table + root-bone travel, for the textual report
  window.inspect = async ({ url }) => {
    const gltf = await load(url);
    const root = gltf.scene;
    scene.add(root);
    const mixer = new THREE.AnimationMixer(root);
    const bones = [];
    root.traverse((o) => { if (o.isBone) bones.push(o); });
    const skinned = []; root.traverse((o) => { if (o.isSkinnedMesh) skinned.push(o); });
    const out = { clips: {}, bones: bones.length, names: bones.slice(0, 3).map((b) => b.name),
                  skinnedMeshes: skinned.length, triangles: 0 };
    skinned.forEach((m) => { out.triangles += m.geometry.index.count / 3; });
    const rootBone = bones.find((b) => !b.parent || !b.parent.isBone) || bones[0];
    for (const clip of gltf.animations) {
      mixer.stopAllAction();
      const act = mixer.clipAction(clip); act.play();
      const lo = new THREE.Vector3(1e9, 1e9, 1e9), hi = new THREE.Vector3(-1e9, -1e9, -1e9);
      const p = new THREE.Vector3();
      const n = 24;
      for (let i = 0; i <= n; i++) {
        mixer.setTime(clip.duration * i / n);
        root.updateMatrixWorld(true);
        rootBone.getWorldPosition(p);
        lo.min(p); hi.max(p);
      }
      const box = new THREE.Box3();
      skinned.forEach((m) => { m.skeleton.update(); });
      out.clips[clip.name] = { duration: +clip.duration.toFixed(3), tracks: clip.tracks.length,
        rootTravel: [hi.x - lo.x, hi.y - lo.y, hi.z - lo.z].map((v) => +v.toFixed(3)),
        rootLo: lo.toArray().map((v) => +v.toFixed(3)), rootHi: hi.toArray().map((v) => +v.toFixed(3)) };
    }
    mixer.stopAllAction(); mixer.setTime(0);
    root.updateMatrixWorld(true);
    // face direction: the head bone's local +Z in world space at rest
    const head = bones.find((b) => /head/i.test(b.name));
    if (head) {
      const q = new THREE.Quaternion(); head.getWorldQuaternion(q);
      out.headForward = new THREE.Vector3(0, 0, 1).applyQuaternion(q).toArray().map((v) => +v.toFixed(2));
    }
    const bb = new THREE.Box3(); skinned.forEach((m) => { m.computeBoundingBox(); });
    root.traverse((o) => { if (o.isSkinnedMesh) bb.union(new THREE.Box3().setFromObject(o)); });
    out.bbox = { min: bb.min.toArray().map((v) => +v.toFixed(3)), max: bb.max.toArray().map((v) => +v.toFixed(3)) };
    scene.remove(root);
    return out;
  };

  // lay PNG data URLs out in a grid (the contact sheet)
  window.compose = async ({ imgs, w, h, cols }) => {
    const c = document.createElement('canvas');
    c.width = cols * w;
    c.height = Math.ceil(imgs.length / cols) * h;
    const ctx = c.getContext('2d');
    await Promise.all(imgs.map((src, i) => new Promise((res) => {
      const im = new window.Image();
      im.onload = () => { ctx.drawImage(im, (i % cols) * w, Math.floor(i / cols) * h); res(); };
      im.src = src;
    })));
    return c.toDataURL('image/png');
  };

  window.ready = true;
</script>
</body>
</html>
